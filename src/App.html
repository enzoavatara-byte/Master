<script>
(function () {
  'use strict';

  var QR_FRESH_MS = 15 * 60 * 1000;  // entri via QR dianggap "sedang di mesin" selama 15 menit
  var EVENT_LABEL = {
    'start': 'Mulai', 'pause': 'Pause', 'resume': 'Lanjut kerja', 'pending': 'Pending', 'lanjut': 'Pending dilanjutkan',
    'complete': 'Selesai', 'cancel': 'Cancel', 'peringatan': 'Peringatan', 'masih lanjut': 'Konfirmasi masih lanjut',
    'abandoned': 'Abandoned', 'review': 'Review'
  };

  var state = {
    boot: null,
    offsetMs: 0,            // serverNow - deviceNow: timer layar mengikuti jam server
    tab: 'home',
    lineView: null,
    qr: INITIAL_LINE_ID ? { line: INITIAL_LINE_ID.toUpperCase(), at: Date.now() } : null,
    pendingFilter: 'ALL',
    history: { status: '', battery: '', scope: 'mine', data: null },
    sheetClose: null
  };

  // ---------- util ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error((e && e.message) || String(e)));
      });
      r[fn].apply(r, args);
    });
  }
  function cleanErr(e) { return String((e && e.message) || e).replace(/^(Error|Exception):\s*/, ''); }
  function syncClock(iso) { if (iso) state.offsetMs = new Date(iso).getTime() - Date.now(); }
  function serverNow() { return Date.now() + state.offsetMs; }
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function hms(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return two(Math.floor(s / 3600)) + ':' + two(Math.floor(s % 3600 / 60)) + ':' + two(s % 60);
  }
  function dur(ms) {
    var m = Math.max(0, Math.floor(ms / 60000));
    if (m < 60) return m + 'm';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'j ' + (m % 60) + 'm';
    return Math.floor(h / 24) + ' hari ' + (h % 24) + 'j';
  }
  function ago(iso) {
    var ms = serverNow() - new Date(iso).getTime();
    if (ms < 60000) return 'baru saja';
    return dur(ms) + ' lalu';
  }
  function fmtShort(iso) {
    if (!iso) return '-';
    var d = new Date(new Date(iso).getTime() + 7 * 3600000); // WIB, tanpa DST
    return two(d.getUTCDate()) + '/' + two(d.getUTCMonth() + 1) + ' ' + two(d.getUTCHours()) + ':' + two(d.getUTCMinutes());
  }
  function initials(name) {
    return String(name || '?').split(/[\s@.]+/).filter(String).slice(0, 2).map(function (p) { return p[0]; }).join('').toUpperCase() || '?';
  }
  function pill(st) { return '<span class="pill st-' + esc(st) + '">' + esc(st) + '</span>'; }
  function isAdmin() { return state.boot && state.boot.user.role === 'Admin'; }
  function me() { return state.boot.user; }
  function busy(btn, on, label) {
    if (!btn) return;
    if (on) { btn.dataset.label = btn.innerHTML; btn.innerHTML = label || 'Memproses…'; btn.disabled = true; }
    else if (btn.dataset.label) { btn.innerHTML = btn.dataset.label; btn.disabled = false; }
  }
  var toastTimer;
  function toast(msg, kind) {
    clearTimeout(toastTimer);
    $('toast-root').innerHTML = '<div class="toast ' + (kind || '') + '">' + esc(msg) + '</div>';
    toastTimer = setTimeout(function () { $('toast-root').innerHTML = ''; }, kind === 'err' ? 6000 : 3000);
  }
  function freshQr(line) {
    return state.qr && state.qr.line === String(line).toUpperCase() && Date.now() - state.qr.at < QR_FRESH_MS;
  }

  // ---------- live timers (tampilan saja; data dari server) ----------
  function liveMs(el) {
    var ms = parseFloat(el.getAttribute('data-base') || '0') * 60000;
    if (el.getAttribute('data-run') === '1') ms += serverNow() - new Date(el.getAttribute('data-since')).getTime();
    return ms;
  }
  function timerAttrs(baseMin, sinceIso, running) {
    return ' data-base="' + esc(baseMin) + '" data-since="' + esc(sinceIso) + '" data-run="' + (running ? 1 : 0) + '"';
  }
  function tick() {
    var i, els = document.querySelectorAll('.js-hms');
    for (i = 0; i < els.length; i++) els[i].textContent = hms(liveMs(els[i]));
    els = document.querySelectorAll('.js-dur');
    for (i = 0; i < els.length; i++) els[i].textContent = dur(liveMs(els[i]));
    els = document.querySelectorAll('.js-ago');
    for (i = 0; i < els.length; i++) els[i].textContent = ago(els[i].getAttribute('data-iso'));
  }
  setInterval(tick, 1000);

  // ---------- navigation ----------
  $('tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-tab]');
    if (b) showTab(b.getAttribute('data-tab'));
  });

  function setView(id) {
    ['home', 'line', 'history', 'review', 'pending', 'qr'].forEach(function (v) {
      $('view-' + v).classList.toggle('hidden', v !== id);
    });
    window.scrollTo(0, 0);
  }

  function showTab(tab) {
    closeSheet();
    state.tab = tab;
    var btns = document.querySelectorAll('nav.tabs button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === tab);
    if (tab === 'home') { state.lineView = null; setView('home'); renderHome(); refresh(); }
    if (tab === 'history') { setView('history'); loadHistory(); }
    if (tab === 'review') { setView('review'); loadReview(); }
    if (tab === 'pending') { setView('pending'); loadPending(); }
    if (tab === 'qr') { setView('qr'); loadQr(); }
  }

  function setBadges(c) {
    $('badge-pending').innerHTML = c.pending ? '<span class="badge">' + c.pending + '</span>' : '';
    $('badge-review').innerHTML = c.review ? '<span class="badge">' + c.review + '</span>' : '';
  }

  // ---------- boot & refresh ----------
  function boot() {
    call('apiBootstrap', INITIAL_LINE_ID || '').then(function (b) {
      state.boot = b;
      syncClock(b.serverNowIso);
      $('tab-qr').classList.toggle('hidden', b.user.role !== 'Admin');
      setBadges(b.counts);
      if (b.lineView) { state.lineView = b.lineView; setView('line'); renderLine(); }
      else renderHome();
    }).catch(function (e) {
      $('view-home').innerHTML = '<div class="card center" style="margin-top:40px"><h2>Gagal memuat</h2><p class="muted">' + esc(cleanErr(e)) +
        '</p><button class="btn" onclick="location.reload()">Coba lagi</button></div>';
    });
  }

  var refreshing = false;
  function refresh() {
    if (!state.boot || refreshing) return Promise.resolve();
    refreshing = true;
    return call('apiRefresh').then(function (r) {
      syncClock(r.serverNowIso);
      var b = state.boot;
      var changed = JSON.stringify(b.myOpen) !== JSON.stringify(r.myOpen) || JSON.stringify(b.recent) !== JSON.stringify(r.recent);
      b.myOpen = r.myOpen; b.counts = r.counts; b.stats = r.stats; b.recent = r.recent;
      setBadges(r.counts);
      if (changed && state.tab === 'home' && !state.lineView && !state.sheetClose) renderHome();
    }).catch(function () { /* diam: refresh latar belakang */ }).then(function () { refreshing = false; });
  }
  setInterval(function () { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });

  // ---------- HOME ----------
  function renderHome() {
    var b = state.boot, u = b.user, warn = b.myOpen && b.myOpen.warnedIso;
    var html = '<div class="hello"><div><div class="hi">Halo, ' + esc(u.name.split(' ')[0]) + ',</div><h1>' +
      (b.myOpen ? 'Semangat kerjanya!' : 'Selamat bekerja!') + '</h1></div>' +
      '<div class="avatar">' + esc(initials(u.name)) + (warn || b.counts.review ? '<span class="dot"></span>' : '') + '</div></div>';

    if (b.myOpen) {
      html += workCard(b.myOpen);
    } else {
      html += '<div class="card dark"><div class="caps">Mulai kerja</div><h2 style="margin:6px 0 4px">Scan QR di line</h2>' +
        '<p class="muted small" style="margin:0 0 16px">Buka kamera HP, arahkan ke QR yang ditempel di line. Halaman line terbuka otomatis.</p>' +
        '<div class="row"><select id="manual-line" class="grow" style="color:var(--text)"><option value="">Pilih line manual…</option>' +
        b.lines.map(function (l) { return '<option value="' + esc(l.id) + '">' + esc(l.id + ' · ' + l.name) + '</option>'; }).join('') +
        '</select><button class="btn ghost" id="btn-open-line" style="width:auto">Buka</button></div>' +
        '<p class="tiny muted" style="margin:8px 0 0">Manual hanya jika QR rusak / tidak terbaca.</p></div>';
    }
    html += weekCard(b.stats) + feedCard(b.recent);
    $('view-home').innerHTML = html;

    if ($('btn-open-line')) $('btn-open-line').onclick = function () {
      var v = $('manual-line').value;
      if (v) openLine(v, this);
    };
    bindWork(b.myOpen, $('view-home'));
    var lh = $('link-history');
    if (lh) lh.onclick = function () { showTab('history'); };
    tick();
  }

  function weekCard(st) {
    var max = Math.max(1, Math.max.apply(null, st.days.map(function (d) { return d.count; })));
    var total = st.days.reduce(function (s, d) { return s + d.count; }, 0);
    return '<div class="card"><div class="caps">Maintenance selesai 7 hari (' + total + ')</div>' +
      '<div class="bars">' + st.days.map(function (d) {
        return '<div class="bar"><span class="n">' + (d.count || '') + '</span><div class="track"><div class="fill" style="height:' +
          Math.round(d.count / max * 100) + '%"></div></div><span class="lbl">' + esc(d.label) + '</span></div>';
      }).join('') + '</div>' +
      '<div class="kpis"><div class="kpi"><span class="tiny muted">MTTR 7 hari</span><b>' +
      (st.mttrMin == null ? '–' : esc(Math.round(st.mttrMin)) + '<span class="small"> mnt</span>') + '</b></div>' +
      '<div class="kpi"><span class="tiny muted">Dihitung</span><b>' + st.mttrN + '<span class="small"> pekerjaan</span></b></div></div>' +
      '<p class="small" style="margin:14px 0 0"><button class="link" id="link-history">Lihat riwayat ›</button></p></div>';
  }

  function feedCard(list) {
    return '<div class="card"><div class="caps">Aktivitas terbaru</div>' + (list.length ? '<ul class="feed">' + list.map(function (e) {
      return '<li><div class="avatar sm">' + esc(initials(e.userName)) + '</div><div class="grow">' +
        '<div class="row between small"><span class="muted">' + esc(e.userName) + '</span><span class="muted js-ago" data-iso="' + esc(e.whenIso) + '">' + esc(ago(e.whenIso)) + '</span></div>' +
        '<div class="title">' + esc((e.line ? e.line + ' · ' : '') + (EVENT_LABEL[e.event] || e.event)) + '</div>' +
        '<div class="small muted clamp">' + esc(e.detail || e.id) + '</div></div></li>';
    }).join('') + '</ul>' : '<div class="empty small">Belum ada aktivitas.</div>') + '</div>';
  }

  // ---------- kartu pekerjaan aktif (dipakai di Beranda & halaman line) ----------
  function workCard(r) {
    var paused = r.status === 'Pause';
    var html = '<div class="card dark work"><div class="top"><div>' + pill(r.status) +
      '<h2>' + esc(r.line) + (r.lineName ? ' · ' + esc(r.lineName) : '') + '</h2>' +
      '<div class="small muted">' + esc(r.id) + ' · Baterai ' + esc(r.battery) + '</div></div></div>';
    if (r.warnedIso) {
      html += '<div class="alert warn" style="margin:16px 0 0"><b>Sudah lebih dari ' + esc(state.boot.limits.warnHours) +
        ' jam.</b> Masih dikerjakan? Jika tidak dijawab sampai ' + esc(state.boot.limits.abandonHours) + ' jam, status jadi Abandoned.' +
        '<div class="btn-row" style="margin-top:12px"><button class="btn ok" data-act="confirm">Masih lanjut</button>' +
        '<button class="btn navy" data-act="pending">Pending</button><button class="btn danger-ghost" data-act="cancel">Cancel</button></div></div>';
    }
    if (paused) {
      html += '<div class="timer paused js-hms"' + timerAttrs(r.pauseMin, r.sinceIso, true) + '>' + hms(0) + '</div>' +
        '<div class="sub-timers muted"><span>Waktu pause</span><span>Aktif <b class="js-dur"' + timerAttrs(r.activeMin, r.sinceIso, false) + '></b></span></div>' +
        '<button class="btn xl" data-act="resume">▶ RESUME</button>' +
        '<div class="btn-row two" style="margin-top:10px"><button class="btn ghost" data-act="pending">Pending</button>' +
        '<button class="btn ghost" data-act="cancel">Cancel</button></div>';
    } else {
      html += '<div class="timer js-hms"' + timerAttrs(r.activeMin, r.sinceIso, true) + '>' + hms(0) + '</div>' +
        '<div class="sub-timers muted"><span>Waktu aktif (MTTR)</span>' + (r.pauseMin ? '<span>Pause <b class="js-dur"' + timerAttrs(r.pauseMin, r.sinceIso, false) + '></b></span>' : '') + '</div>' +
        '<button class="btn xl ok" data-act="complete">✔ SELESAI</button>' +
        '<div class="btn-row" style="margin-top:10px"><button class="btn ghost" data-act="pause">Pause</button>' +
        '<button class="btn ghost" data-act="pending">Pending</button><button class="btn ghost" data-act="cancel">Cancel</button></div>';
    }
    if (r.dikerjakan) {
      html += '<details style="margin-top:14px"><summary class="small muted">Pekerjaan sebelumnya</summary>' +
        '<div class="small" style="white-space:pre-line;margin-top:8px">' + esc(r.dikerjakan) + '</div></details>';
    }
    return html + '</div>';
  }

  function bindWork(r, root) {
    if (!r) return;
    var btns = root.querySelectorAll('[data-act]');
    for (var i = 0; i < btns.length; i++) {
      (function (b) {
        b.onclick = function () {
          var a = b.getAttribute('data-act');
          if (a === 'resume') act(b, 'apiResume', [r.id], 'Lanjut kerja. Timer aktif berjalan.');
          if (a === 'confirm') act(b, 'apiConfirmStillWorking', [r.id], 'Tercatat: masih dikerjakan.');
          if (a === 'pause') pauseSheet(r);
          if (a === 'pending') pendingSheet(r);
          if (a === 'complete') completeSheet(r);
          if (a === 'cancel') cancelSheet(r);
        };
      })(btns[i]);
    }
  }

  /** Semua aksi kerja mengembalikan lineView terbaru. */
  function act(btn, fn, args, okMsg) {
    busy(btn, true);
    return call.apply(null, [fn].concat(args)).then(function (v) {
      closeSheet();
      syncClock(v.serverNowIso);
      var mine = state.boot.myOpen;
      if (v.openIsMine) state.boot.myOpen = v.open;
      else if (mine && v.line && mine.line === v.line.id) state.boot.myOpen = null;
      if (state.lineView) { state.lineView = v; renderLine(); } else renderHome();
      toast(okMsg, 'ok');
      refresh();
      return v;
    }).catch(function (e) { busy(btn, false); toast(cleanErr(e), 'err'); throw e; });
  }

  // ---------- bottom sheet ----------
  function openSheet(html, onClose) {
    closeSheet();
    $('sheet-root').innerHTML = '<div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"><div class="grab"></div>' + html + '</div></div>';
    $('sheet-bg').addEventListener('click', function (ev) { if (ev.target.id === 'sheet-bg') closeSheet(); });
    state.sheetClose = onClose || function () {};
    return $('sheet');
  }
  function closeSheet() {
    if (!state.sheetClose) return;
    var fn = state.sheetClose;
    state.sheetClose = null;
    try { fn(); } catch (e) { /* abaikan */ }
    $('sheet-root').innerHTML = '';
  }
  function chips(name, values, opts) {
    opts = opts || {};
    return '<div class="chips' + (opts.big ? ' big' : '') + '" data-chips="' + esc(name) + '">' + values.map(function (v) {
      var val = typeof v === 'string' ? v : v.value, label = typeof v === 'string' ? v : v.label;
      return '<button type="button" class="chip' + (opts.selected === val ? ' on' : '') + '" data-val="' + esc(val) + '">' + esc(label) + '</button>';
    }).join('') + '</div>';
  }
  function bindChips(root, onChange) {
    var groups = root.querySelectorAll('[data-chips]');
    for (var i = 0; i < groups.length; i++) {
      (function (g) {
        g.addEventListener('click', function (ev) {
          var c = ev.target.closest('.chip');
          if (!c) return;
          var all = g.querySelectorAll('.chip');
          for (var j = 0; j < all.length; j++) all[j].classList.toggle('on', all[j] === c);
          if (onChange) onChange(g.getAttribute('data-chips'), c.getAttribute('data-val'));
        });
      })(groups[i]);
    }
  }
  function chipVal(root, name) {
    var c = root.querySelector('[data-chips="' + name + '"] .chip.on');
    return c ? c.getAttribute('data-val') : '';
  }
  function selectHtml(id, list, placeholder) {
    return '<select id="' + id + '"><option value="">' + esc(placeholder) + '</option>' +
      list.map(function (v) { return '<option>' + esc(v) + '</option>'; }).join('') + '</select>';
  }

  function pauseSheet(r) {
    var reasons = state.boot.options['Alasan Pause'];
    var s = openSheet('<h2>Pause</h2><p class="small muted">Pilih alasan — langsung tersimpan. Timer aktif berhenti, timer pause berjalan.</p>' +
      chips('reason', reasons.concat([{ value: '', label: 'Tanpa alasan' }]), { big: true }));
    s.querySelector('[data-chips]').addEventListener('click', function (ev) {
      var c = ev.target.closest('.chip');
      if (c) act(c, 'apiPause', [r.id, c.getAttribute('data-val')], 'Pause. Tap RESUME saat kembali.');
    });
  }

  function pendingSheet(r) {
    var o = state.boot.options;
    var s = openSheet('<h2>Pending</h2><p class="small muted">Satu form. Pekerjaan ini akan muncul di tab Pending untuk semua teknisi.</p>' +
      '<div class="stack">' +
      '<div><label class="lbl">Pekerjaan yang sudah dilakukan *</label><textarea id="p-done" placeholder="mis. cek wiring, sensor ditemukan rusak"></textarea></div>' +
      '<div><label class="lbl">Yang tertunda *</label>' + chips('tertunda', o['Yang Tertunda']) + '</div>' +
      '<div><label class="lbl">Tenggat *</label>' + chips('tenggat', [
        { value: 'HARI_INI', label: 'Hari ini' }, { value: 'SHIFT', label: 'Shift berikutnya' },
        { value: 'BESOK', label: 'Besok' }, { value: 'TANGGAL', label: 'Pilih tanggal' }]) +
      '<input type="date" id="p-date" class="hidden" style="margin-top:8px"></div>' +
      '<div><label class="lbl">Catatan <span class="muted">(wajib jika "Lainnya")</span></label><textarea id="p-note"></textarea></div>' +
      '<button class="btn navy" id="p-save">Simpan pending</button></div>');
    bindChips(s, function (name, val) { if (name === 'tenggat') $('p-date').classList.toggle('hidden', val !== 'TANGGAL'); });
    $('p-save').onclick = function () {
      act(this, 'apiPending', [r.id, {
        dikerjakan: $('p-done').value, tertunda: chipVal(s, 'tertunda'), tenggat: chipVal(s, 'tenggat'),
        tanggal: $('p-date').value, catatan: $('p-note').value
      }], 'Tersimpan sebagai Pending.').then(function () {
        if (state.lineView) return;
        showTab('pending');
      }).catch(function () {});
    };
  }

  function completeSheet(r) {
    var o = state.boot.options;
    var s = openSheet('<h2>Selesai</h2><p class="small muted">Waktu selesai dicatat server saat disimpan.</p><div class="stack">' +
      '<div><label class="lbl">Masalah *</label>' + selectHtml('c-masalah', o['Masalah'], 'Pilih masalah…') + '</div>' +
      '<div><label class="lbl">Penyebab *</label>' + selectHtml('c-penyebab', o['Penyebab'], 'Pilih penyebab…') + '</div>' +
      '<div><label class="lbl">Penanganan *</label>' + selectHtml('c-penanganan', o['Penanganan'], 'Pilih penanganan…') + '</div>' +
      '<div><label class="lbl">Part yang diganti *</label>' + chips('part', [{ value: 'NONE', label: 'Tidak ada' }, { value: 'SOME', label: 'Ada part' }]) +
      '<div id="c-parts" class="hidden" style="margin-top:10px"><div id="c-part-rows"></div>' +
      '<button type="button" class="link" id="c-add-part">+ Tambah part</button></div></div>' +
      '<div><label class="lbl">Catatan <span class="muted">(opsional; wajib jika "Lainnya")</span></label><textarea id="c-note"></textarea></div>' +
      '<button class="btn ok" id="c-save">Simpan & selesai</button></div>');

    function addRow() {
      var d = document.createElement('div');
      d.className = 'part-row';
      d.innerHTML = selectHtml('', o['Part'], 'Pilih part…') + '<input type="number" min="1" max="999" value="1" inputmode="numeric">' +
        '<button type="button" aria-label="Hapus">×</button>';
      d.querySelector('button').onclick = function () { d.remove(); };
      $('c-part-rows').appendChild(d);
    }
    bindChips(s, function (name, val) {
      if (name !== 'part') return;
      $('c-parts').classList.toggle('hidden', val !== 'SOME');
      if (val === 'SOME' && !$('c-part-rows').children.length) addRow();
    });
    $('c-add-part').onclick = addRow;
    $('c-save').onclick = function () {
      var partMode = chipVal(s, 'part');
      if (!partMode) { toast('Pilih part yang diganti, atau "Tidak ada".', 'err'); return; }
      var rows = $('c-part-rows').querySelectorAll('.part-row');
      var parts = [];
      for (var i = 0; i < rows.length; i++) {
        var n = rows[i].querySelector('select').value;
        if (n) parts.push({ nama: n, jumlah: Number(rows[i].querySelector('input').value) });
      }
      act(this, 'apiComplete', [r.id, {
        masalah: $('c-masalah').value, penyebab: $('c-penyebab').value, penanganan: $('c-penanganan').value,
        tanpaPart: partMode === 'NONE', parts: parts, catatan: $('c-note').value
      }], 'Maintenance selesai. Terima kasih!').catch(function () {});
    };
  }

  function cancelSheet(r) {
    var s = openSheet('<h2>Cancel maintenance</h2><p class="small muted">Alasan wajib. Record masuk review Admin dan tidak dihitung ke MTTR.</p><div class="stack">' +
      chips('reason', state.boot.options['Alasan Cancel'], { big: true }) +
      '<div><label class="lbl">Catatan <span class="muted">(wajib jika "Lainnya")</span></label><textarea id="x-note"></textarea></div>' +
      '<button class="btn danger-ghost" id="x-save">Konfirmasi cancel</button></div>');
    bindChips(s);

  // ---------- Lanjutkan pending: konfirmasi QR ----------
  function continuePending(p, btn) {
    function go(lineId, b) {
      busy(b, true, 'Melanjutkan…');
      return call('apiContinue', p.id, lineId).then(function (v) {
        closeSheet();
        syncClock(v.serverNowIso);
        state.qr = { line: String(lineId).toUpperCase(), at: Date.now() };
        state.boot.myOpen = v.open;
        state.lineView = v;
        state.tab = 'home';
        var btns = document.querySelectorAll('nav.tabs button');
        for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === 'home');
        setView('line');
        renderLine();
        toast('Pending dilanjutkan. Timer aktif berjalan.', 'ok');
        refresh();
      }).catch(function (e) { busy(b, false); toast(cleanErr(e), 'err'); });
    }
    if (freshQr(p.line)) return go(state.qr.line, btn);   // masuk lewat scan QR: konfirmasi dilewati
    openScanner(p.line, function (scanned) { go(scanned, null); });
  }

  function lineFromQr(text) {
    text = String(text || '').trim();
    var m = /[?&]line=([^&#]+)/.exec(text);
    var v = m ? decodeURIComponent(m[1]) : text;
    return /^[A-Za-z0-9_.-]{1,50}$/.test(v) ? v.toUpperCase() : '';
  }

  function openScanner(expectLine, onLine) {
    var stream = null, stopped = false, timer = null;
    var s = openSheet('<h2>Scan QR line ' + esc(expectLine) + '</h2>' +
      '<p class="small muted">Konfirmasi Anda benar-benar di mesin. Arahkan kamera ke QR yang ditempel di line.</p>' +
      '<div class="scan-box" id="scan-box"><video id="scan-video" playsinline muted></video><div class="frame"></div></div>' +
      '<p class="small center" id="scan-status" style="margin-top:12px">Membuka kamera…</p>', function () {
        stopped = true;
        clearTimeout(timer);
        if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      });

    function fallback(reason) {
      if (stopped) return;
      $('scan-box').classList.add('hidden');
      $('scan-status').innerHTML = '<div class="alert warn" style="text-align:left"><b>Kamera tidak bisa dibuka di dalam aplikasi</b> (' + esc(reason) + ').<br>' +
        'Tutup layar ini, lalu scan QR line <b>' + esc(expectLine) + '</b> dengan aplikasi kamera HP. Halaman line akan terbuka dengan tombol <b>Lanjutkan</b> tanpa scan ulang.</div>';
    }
    function found(text) {
      var line = lineFromQr(text);
      if (!line) { $('scan-status').textContent = 'QR tidak dikenali, coba lagi…'; return false; }
      if (line !== String(expectLine).toUpperCase()) { $('scan-status').textContent = 'Ini QR line ' + line + ', bukan ' + expectLine + '.'; return false; }
      $('scan-status').textContent = 'QR ' + line + ' terbaca ✓';
      stopped = true;
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      onLine(line);
      return true;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fallback('browser tidak mendukung');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then(function (st) {
      if (stopped) { st.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = st;
      var video = $('scan-video');
      video.srcObject = st;
      video.play();
      $('scan-status').textContent = 'Mencari QR…';
      getDecoder().then(function (decode) {
        var canvas = document.createElement('canvas'), c2d = canvas.getContext('2d');
        (function loop() {
          if (stopped) return;
          if (video.readyState >= 2) {
            decode(video, canvas, c2d).then(function (text) {
              if (!(text && found(text))) timer = setTimeout(loop, 250);
            }).catch(function () { timer = setTimeout(loop, 400); });
          } else timer = setTimeout(loop, 250);
        })();
      }).catch(function () { fallback('decoder QR gagal dimuat'); });
    }).catch(function (e) { fallback((e && e.name) || 'izin ditolak'); });
  }

  /** BarcodeDetector (Chrome Android) jika ada, selain itu jsQR dari CDN. */
  var decoderPromise = null;
  function getDecoder() {
    if (decoderPromise) return decoderPromise;
    if ('BarcodeDetector' in window) {
      var det = new window.BarcodeDetector({ formats: ['qr_code'] });
      decoderPromise = Promise.resolve(function (video) {
        return det.detect(video).then(function (codes) { return codes.length ? codes[0].rawValue : ''; });
      });
    } else {
      decoderPromise = new Promise(function (resolve, reject) {
        var sc = document.createElement('script');
        sc.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
        sc.onload = function () {
          resolve(function (video, canvas, c2d) {
            var w = video.videoWidth, h = video.videoHeight, scale = Math.min(1, 640 / Math.max(w, h));
            canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
            c2d.drawImage(video, 0, 0, canvas.width, canvas.height);
            var img = c2d.getImageData(0, 0, canvas.width, canvas.height);
            var code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
            return Promise.resolve(code ? code.data : '');
          });
        };
        sc.onerror = function () { decoderPromise = null; reject(new Error('load')); };
        document.head.appendChild(sc);
      });
    }
    return decoderPromise;
  }

  function downloadCsv() {
    var data = state.history.data;
    if (!data) return;
    var cols = [['id', 'Maintenance ID'], ['line', 'Line'], ['battery', 'Baterai'], ['status', 'Status'], ['techFirstName', 'Teknisi awal'],
      ['techLastName', 'Teknisi terakhir'], ['startText', 'Mulai'], ['finishText', 'Selesai'], ['activeMin', 'Total aktif (menit)'],
      ['pauseMin', 'Total pause (menit)'], ['pendingMin', 'Total pending (menit)'], ['masalah', 'Masalah'], ['penyebab', 'Penyebab'],
      ['penanganan', 'Penanganan'], ['part', 'Part'], ['tertunda', 'Yang tertunda'], ['tenggatText', 'Tenggat'], ['cancelReason', 'Alasan cancel'],
      ['review', 'Status review'], ['mttr', 'Masuk MTTR'], ['catatan', 'Catatan']];
    function cell(v) {
      v = v == null ? '' : String(v);
      if (/^[=+\-@]/.test(v)) v = "'" + v;   // cegah formula injection saat dibuka di Excel
      return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }
    var out = [cols.map(function (c) { return c[1]; }).join(',')].concat(data.map(function (r) {
      return cols.map(function (c) { return cell(r[c[0]]); }).join(',');
    }));
    var blob = new Blob(['﻿' + out.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mttr-' + new Date(serverNow()).toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

    var html = '<div class="hello"><div><div class="hi">' + (isAdmin() ? 'Semua item' : 'Item milik saya') + '</div><h1>Review</h1></div></div>';
    if (res.warnings.length) {
      html += '<div class="caps" style="margin:0 4px 8px">Peringatan > ' + esc(state.boot.limits.warnHours) + ' jam (menunggu jawaban teknisi)</div>' +
        res.warnings.map(function (r) {
          return '<div class="item" style="cursor:default;border-left:5px solid var(--warn)"><div class="row between"><span class="t">' + esc(r.line) + ' · ' + esc(r.techLastName) + '</span>' + pill(r.status) + '</div>' +
            '<div class="small muted">' + esc(r.id) + ' · diperingatkan ' + esc(fmtShort(r.warnedIso)) + ' · Abandoned otomatis jika tidak dijawab</div></div>';
        }).join('');
    }
    if (!res.items.length && !res.warnings.length) {
      html += '<div class="card center"><h2>Semua beres</h2><p class="muted">Tidak ada item yang perlu direview.</p></div>';
    }
    html += res.items.map(function (r) {
      var info = '';
      if (r.status === 'Pending') info = esc(r.tertunda) + ' · tenggat ' + esc(fmtShort(r.tenggatIso)) + (r.overdue ? ' <b style="color:var(--danger)">LEWAT</b>' : '');
      if (r.status === 'Cancelled') info = 'Alasan: ' + esc(r.cancelReason);
      if (r.status === 'Abandoned') info = 'Tercatat aktif ' + esc(dur(r.activeMin * 60000)) + ', pause ' + esc(dur(r.pauseMin * 60000)) + ' · Abandoned ' + esc(fmtShort(r.sinceIso));
      var form = '';
      if (!r.canDecide) {
        form = '<p class="small muted" style="margin:10px 0 0">Menunggu review Admin.</p>';
      } else if (r.status === 'Pending') {
        form = '<input type="text" data-f="note" placeholder="Catatan (opsional)" style="margin-top:12px">' +
          '<button class="btn ghost" data-review="CEK" style="margin-top:8px">Tandai sudah dicek</button>';
      } else if (r.status === 'Cancelled') {
        form = '<input type="text" data-f="note" placeholder="Catatan (opsional)" style="margin-top:12px">' +
          '<button class="btn ghost" data-review="SETUJU" style="margin-top:8px">Setujui cancel</button>';
      } else if (r.status === 'Abandoned') {
        form = '<label class="lbl" style="margin-top:12px">Menit aktif sebenarnya (jika dihitung)</label>' +
          '<input type="number" data-f="min" min="1" value="' + esc(Math.max(1, Math.round(r.activeMin))) + '">' +
          '<label class="lbl" style="margin-top:10px">Catatan review * (dasar keputusan)</label>' +
          '<textarea data-f="note" placeholder="mis. konfirmasi teknisi via telepon, selesai ±14:30"></textarea>' +
          '<div class="btn-row two" style="margin-top:10px"><button class="btn ok" data-review="HITUNG">Hitung ke MTTR</button>' +
          '<button class="btn danger-ghost" data-review="KELUARKAN">Keluarkan</button></div>';
      }
      return '<div class="card" data-id="' + esc(r.id) + '"><div class="row between">' + pill(r.status) + '<button class="link" data-detail="' + esc(r.id) + '">Detail ›</button></div>' +
        '<h2 style="margin:8px 0 2px;font-size:18px">' + esc(r.line) + ' · ' + esc(r.battery) + '</h2>' +
        '<div class="small muted">' + esc(r.id) + ' · ' + esc(r.techFirstName) + (r.techLast !== r.techFirst ? ' → ' + esc(r.techLastName) : '') + '</div>' +
        '<div class="small" style="margin-top:6px">' + info + '</div>' + form + '</div>';
    }).join('');
    $('view-review').innerHTML = html;
    bindDetailLinks($('view-review'));
    var bs = document.querySelectorAll('[data-review]');
    for (var i = 0; i < bs.length; i++) {
      bs[i].onclick = function () {
        var b = this, card = b.closest('[data-id]');
        var note = card.querySelector('[data-f="note"]'), min = card.querySelector('[data-f="min"]');
        busy(b, true, 'Menyimpan…');
        call('apiReview', card.getAttribute('data-id'), {
          action: b.getAttribute('data-review'), note: note ? note.value : '', activeMin: min ? Number(min.value) : null
        }).then(function (r) { renderReview(r); toast('Keputusan review tersimpan.', 'ok'); refresh(); })
          .catch(function (e) { busy(b, false); toast(cleanErr(e), 'err'); });
      };
    }
  }

  // ---------- QR (Admin) ----------
  function loadQr() {
    $('view-qr').innerHTML = '<div class="loading">Memuat line…</div>';
    call('apiListLinesForQr').then(function (res) {
      var base = res.baseUrl || '';
      var devWarn = /\/dev$/.test(base) ? '<div class="alert warn">URL saat ini /dev (hanya untuk editor). Buka dari URL deployment /exec sebelum mencetak QR.</div>' : '';
      $('view-qr').innerHTML = '<div class="hello no-print"><div><div class="hi">Admin</div><h1>QR Line</h1></div>' +
        '<button class="btn" style="width:auto" onclick="window.print()">Cetak</button></div>' + devWarn +
        '<p class="small muted no-print" style="margin:0 4px 14px">Tambah line di sheet <b>Lines</b>, lalu buka tab ini lagi. Isi QR = URL web app + <code>?line=ID</code>.</p>' +
        '<div class="qr-grid">' + res.lines.map(function (l, i) {
          return '<div class="qr-card"><b style="font-size:18px">' + esc(l.id) + '</b><div class="small">' + esc(l.name) + '</div>' +
            '<div class="qr" id="qr-' + i + '"></div><div class="small muted">' + esc(l.area) + '</div>' +
            (l.active ? '' : '<div class="small" style="color:var(--danger)">NONAKTIF</div>') + '</div>';
        }).join('') + '</div>';
      res.lines.forEach(function (l, i) {
        var url = base + '?line=' + encodeURIComponent(l.id);
        if (window.QRCode) new QRCode($('qr-' + i), { text: url, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M });
        else $('qr-' + i).innerHTML = '<div class="small" style="word-break:break-all">' + esc(url) + '</div>';
      });
    }).catch(function (e) { $('view-qr').innerHTML = '<div class="alert err">' + esc(cleanErr(e)) + '</div>'; });
  }

  boot();
})();
</script>
