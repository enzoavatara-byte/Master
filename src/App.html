        prev = g.cum || 0;
        var sub = res.by === 'sparepart' ? t('{n} pekerjaan', { n: g.n })
          : res.measure === 'mtbf' ? t('{n}× rusak · jam operasi {h}', { n: g.n, h: jam(g.jamOperasi) })
          : (res.measure === 'frek' ? '' : t('{n}× rusak', { n: g.n }) + ' · ') + (res.measure === 'mttr' ? t('downtime {d} jam', { d: jam(g.downtime) }) : 'MTTR ' + mnt(g.mttr) + ' ' + t('mnt'));
        if (res.pareto) sub = t('kumulatif {p}%', { p: String(g.cum).replace('.', LANG === 'zh' ? '.' : ',') }) + (sub ? ' · ' + sub : '');
        var name = keyLabel(g.label);
        return '<button type="button" class="stat-row" data-k="' + esc(g.key) + '" title="' + esc(name + ': ' + statValue(res, g.value) + ' · ' + sub) + '">' +
          '<div class="row between small"><span class="grow clamp1">' + esc(name) + '</span><b>' + esc(statValue(res, g.value)) + '</b></div>' +
          '<div class="htrack"><div class="hfill ' + (res.pareto ? (vital ? 'vital' : 'rest') : 'vital') + '" style="width:' + Math.max(2, Math.round((g.value || 0) / max * 100)) + '%"></div></div>' +
          '<div class="tiny muted">' + esc(sub) + '</div></button>';
      }).join('') + '</div>' + (res.more ? '<p class="tiny muted" style="margin:8px 0 0">' + esc(t('+{n} kelompok lain tidak ditampilkan. Persempit dengan filter.', { n: res.more })) + '</p>' : '');
    }
    (res.warn || []).forEach(function (w) { html += '<p class="tiny" style="color:var(--warn);margin:8px 0 0">' + esc(w) + '</p>'; });
    body.innerHTML = html + '</div>';
    [].forEach.call(body.querySelectorAll('[data-k]'), function (el) {
      el.onclick = function () {
        var g = res.groups.filter(function (x) { return x.key === el.getAttribute('data-k'); })[0];
        if (g && g.n) openStatItems(g, res);
      };
    });
  }

  function openStatItems(g, res) {
    var s = openSheet('<h2>' + esc(keyLabel(g.label)) + '</h2><p class="small muted">' + esc(periodText(state.stat.p) + ' · ' + statValue(res, g.value) +
      (res.measure === 'frek' && res.by !== 'sparepart' ? '' : ' · ' + t('{n}× rusak', { n: g.n }))) + '</p><div id="si-list"><div class="loading">Memuat…</div></div>');
    call('apiStatsItems', statFilter(), g.key).then(function (r) {
      syncClock(r.serverNowIso);
      var box = s.querySelector('#si-list');
      box.innerHTML = (r.total > r.items.length ? '<p class="tiny muted">' + esc(t('(ditampilkan {n} terbaru)', { n: r.items.length })) + '</p>' : '') +
        r.items.map(function (x) { return itemHtml(x, true); }).join('');
      bindDetailLinks(box);
    }).catch(function (e) { s.querySelector('#si-list').innerHTML = '<div class="alert err">' + esc(cleanErr(e)) + '</div>'; });
  }

  function fetchDashboard() {
    var f = serverFilter();
    f.periode = state.dash.periode;
    $('d-body').innerHTML = '<div class="loading">Menghitung…</div>';
    call('apiDashboard', f).then(renderDashboard).catch(function (e) { $('d-body').innerHTML = '<div class="alert err">' + esc(cleanErr(e)) + '</div>'; });
  }

  function tile(label, value, unit, sub) {
    return '<div class="kpi"><span class="tiny muted">' + esc(label) + '</span><b>' + value + (unit ? '<span class="small"> ' + esc(unit) + '</span>' : '') + '</b>' +
      (sub ? '<span class="tiny muted">' + sub + '</span>' : '') + '</div>';
  }

  /** Bar horizontal satu warna (satu seri → tanpa legend), nilai di ujung bar. */
  /** "Stacking · L01", "Masalah → teks bebas": tiap bagian lewat kamus (teks bebas tetap). */
  function keyLabel(k) { return String(k).split(/( · | → )/).map(function (p, i) { return i % 2 ? p : L(p); }).join(''); }
  function rankList(title, items, opts) {
    opts = opts || {};
    if (!items.length) return '<div class="card"><div class="caps">' + esc(title) + '</div><div class="empty small">Belum ada data di periode ini.</div></div>';
    // opts.byMinutes: panjang batang & angka kanan = total waktu (daftar "terlama"), selain itu jumlah kejadian.
    var val = function (i) { return opts.byMinutes ? i.minutes : i.count; };
    var max = Math.max.apply(null, items.map(val)) || 1;
    return '<div class="card"><div class="caps">' + esc(title) + '</div>' + (opts.note ? '<p class="tiny muted" style="margin:4px 0 0">' + opts.note + '</p>' : '') +
      '<div class="rank">' + items.map(function (i) {
        var sub = opts.sub ? opts.sub(i) : '';
        var name = keyLabel(i.key) + (i.name ? ' · ' + L(i.name) : ''), right = opts.byMinutes ? dur(i.minutes * 60000) : i.count + '×';
        return '<div class="rank-row" title="' + esc(name + ': ' + right + (sub ? ' · ' + sub : '')) + '"><div class="row between small"><span class="grow clamp1">' + esc(name) + '</span>' +
          '<b>' + esc(right) + '</b></div><div class="htrack"><div class="hfill" style="width:' + Math.max(2, Math.round(val(i) / max * 100)) + '%"></div></div>' +
          (sub ? '<div class="tiny muted">' + esc(sub) + '</div>' : '') + '</div>';
      }).join('') + '</div></div>';
  }

  /** KPI bulan berjalan (2.6): Plant = 4 angka, project = baris dengan target & ✓ / ✗ (teks + warna). Admin: tutup bulan lalu. */
  function kpiCard(k) {
    if (!k || !k.rows || !k.rows.length) return '';
    var plant = k.rows[0], proj = k.rows.slice(1), mLabel = monthLabel(k.bulan, k.label);
    var verdict = function (x) {
      if (!x.tercapai) return '';
      return x.tercapai === '✓' ? '<span class="status ok">' + esc(t('✓ Tercapai')) + '</span>'
        : '<span class="status over">' + esc(t('✗ {x} belum tercapai', { x: x.tercapai.replace(/^✗\s*/, '') })) + '</span>';
    };
    var tgt = function (v, ge, unit) { return v == null ? '' : ' <span class="muted">(' + esc(t(ge ? 'target ≥ {v} {u}' : 'target ≤ {v} {u}', { v: ge ? jam(v) : mnt(v), u: t(unit) })) + ')</span>'; };
    var html = '<div class="card"><div class="caps">' + esc(t('KPI bulan ini · {m}', { m: mLabel })) + '</div>' +
      '<p class="tiny muted" style="margin:4px 0 0">' + esc(t('Semua line. MTBF = (jam operasi − downtime) ÷ jumlah kerusakan. Angka bisa berubah sampai bulan ditutup admin.')) + '</p>' +
      '<div class="kpis four" style="margin:10px 0 4px">' +
      tile('MTTR', mnt(plant.mttr), plant.mttr == null ? '' : 'mnt', '') +
      tile('MTBF', jam(plant.mtbf), plant.mtbf == null ? '' : 'jam', plant.kerusakan ? '' : esc(t('tanpa kerusakan'))) +
      tile('Kerusakan', plant.kerusakan, '', '') +
      tile('Downtime', jam(plant.downtime), 'jam', esc(t('jam operasi {h}', { h: jam(plant.jamOperasi) }))) + '</div>';
    if (proj.length) {
      html += '<div class="rank">' + proj.map(function (x) {
        return '<div class="rank-row"><div class="row between"><b>' + esc(x.nama) + '</b>' + verdict(x) + '</div>' +
          '<div class="small">MTTR <b>' + mnt(x.mttr) + '</b> ' + esc(t('mnt')) + tgt(x.targetMttr, false, 'mnt') +
          ' · MTBF <b>' + jam(x.mtbf) + '</b> ' + esc(t('jam')) + tgt(x.targetMtbf, true, 'jam') + '</div>' +
          '<div class="tiny muted">' + esc(t('{n}× rusak · downtime {d} jam · jam operasi {h}', { n: x.kerusakan, d: jam(x.downtime), h: jam(x.jamOperasi) })) + '</div></div>';
      }).join('') + '</div>';
    }
    (k.warn || []).forEach(function (w) { html += '<p class="tiny" style="color:var(--warn);margin:8px 0 0">' + esc(w) + '</p>'; });
    var p = k.prev;
    if (p) {
      var pl = monthLabel(p.bulan, p.label);
      html += '<div style="margin-top:12px">' + (p.closedIso
        ? '<p class="tiny muted" style="margin:0">' + esc(t('{m} sudah ditutup {d} oleh {n}.', { m: pl, d: fmtShort(p.closedIso), n: p.closedBy })) +
          ' <button type="button" class="link" id="d-close" data-ym="' + esc(p.bulan) + '" data-label="' + esc(pl) + '" data-re="1">' + esc(t('Tutup ulang')) + '</button></p>'
        : '<div class="alert warn" style="margin-bottom:10px">' + esc(t('{m} belum ditutup.', { m: pl })) +
          (p.reviews ? ' <b>' + esc(t('{n} pekerjaan bulan itu masih menunggu review', { n: p.reviews })) + '</b> — ' + esc(t('sebaiknya direview dulu.')) : '') + '</div>' +
          '<button type="button" class="btn navy" id="d-close" data-ym="' + esc(p.bulan) + '" data-label="' + esc(pl) + '">' + esc(t('Tutup bulan {m}', { m: pl })) + '</button>') + '</div>';
    }
    return html + '</div>';
  }

  function closeMonth(btn) {
    var ym = btn.getAttribute('data-ym'), label = btn.getAttribute('data-label'), re = btn.getAttribute('data-re');
    var s = openSheet('<h2>' + esc(t('Tutup bulan {m}', { m: label })) + '</h2><p class="small">' +
      esc(t('Angka KPI {m} dikunci: edit data lama sesudah ini tidak mengubahnya lagi. Tab KPI di Google Sheet ikut diperbarui.', { m: label })) + '</p>' +
      (re ? '<p class="small muted">' + esc(t('Sudah pernah ditutup: angka lama diganti angka sekarang, dan keduanya dicatat di Log.')) + '</p>' : '') +
      '<button class="btn navy" id="tb-ok">' + esc(re ? t('Tutup ulang') : t('Tutup bulan')) + '</button>');
    s.querySelector('#tb-ok').onclick = function () {
      var b = this;
      busy(b, true, t('Memproses…'));
      call('apiTutupBulan', ym).then(function (res) {
        closeSheet();
        toast(t('{m} ditutup.', { m: label }) + (res.reviews ? ' ' + t('{n} pekerjaan masih menunggu review: tutup ulang setelah direview.', { n: res.reviews }) : ''), 'ok');
        fetchDashboard();
      }).catch(function (e) { busy(b, false); toast(cleanErr(e), 'err'); });
    };
  }

  function renderDashboard(d) {
    syncClock(d.serverNowIso);
    var k = d.kpi;
    var html = '<div class="kpis four">' +
      tile(t('MTTR ({x})', { x: L(d.mttrTypes) }), mnt(k.mttr), k.mttr == null ? '' : 'mnt', esc(t('{n} pekerjaan dihitung', { n: k.mttrN }))) +
      tile('Corrective selesai', k.corrective, '', esc(t('{d} total aktif', { d: dur(k.activeMin * 60000) }))) +
      tile('Sedang berjalan', k.openNow, '', esc(t('{n} pending', { n: k.pendingNow })) + (k.overdueNow ? ' · <span style="color:var(--danger);font-weight:800">' + esc(t('{n} lewat tenggat', { n: k.overdueNow })) + '</span>' : '')) +
      tile('Downtime stop line', jam(k.downtimeMin / 60), 'jam', esc(t('{n} pekerjaan stop line', { n: k.stopN }))) +
      '</div>';
    html += kpiCard(d.kpiMonth);

    // Project
    if (d.projects.length) {
      html += '<div class="caps" style="margin:4px 4px 8px">Status project</div><div class="proj-grid">' + d.projects.map(function (p) {
        var health = p.health === 'ok' ? '<span class="status ok">✓ Sesuai target</span>' : (p.health === 'over' ? '<span class="status over">▲ Di atas target</span>' : '');
        return '<div class="card proj"><div class="row between"><b style="font-size:17px">' + esc(p.battery) + '</b><span class="tag-lite">' + esc(p.fase || 'Fase belum diisi') + '</span></div>' +
          '<div class="tiny muted">' + esc(p.factoryName || '') + (p.catatan ? ' · ' + esc(p.catatan) : '') + '</div>' +
          '<div class="row between" style="margin-top:10px"><div><span class="tiny muted">MTTR</span><div><b style="font-size:22px">' + mnt(p.mttr) + '</b><span class="small"> mnt</span></div></div>' +
          '<div style="text-align:right"><span class="tiny muted">Target</span><div><b>' + (p.target ? esc(t('{n} mnt', { n: p.target })) : '–') + '</b></div></div></div>' +
          (health ? '<div style="margin-top:6px">' + health + '</div>' : '') +
          '<div class="tiny muted" style="margin-top:6px">' + esc(t('{a} dihitung · {b} berjalan · {c} pending', { a: p.n, b: p.openNow, c: p.pendingNow }) + (p.overdueNow ? ' · ' + t('{n} lewat', { n: p.overdueNow }) : '')) + '</div></div>';
      }).join('') + '</div>';
    }

    // Tren 12 minggu (satu seri: jumlah selesai)
    var wmax = Math.max(1, Math.max.apply(null, d.weeks.map(function (w) { return w.count; })));
    var last = d.weeks[d.weeks.length - 1];
    html += '<div class="card"><div class="caps">Maintenance selesai per minggu (12 minggu)</div>' +
      '<div class="cols" id="d-cols">' + d.weeks.map(function (w, i) {
        var isMax = w.count === wmax && w.count > 0, isLast = i === d.weeks.length - 1;
        return '<button type="button" class="col" data-i="' + i + '" title="' + esc(t('Minggu {w}: {n} selesai · MTTR {m} mnt', { w: w.label, n: w.count, m: mnt(w.mttr) })) + '">' +
          '<span class="n">' + ((isMax || isLast) && w.count ? w.count : '') + '</span><span class="ctrack"><span class="cfill" style="height:' + Math.round(w.count / wmax * 100) + '%"></span></span>' +
          '<span class="lbl">' + (i % 3 === 2 || isLast ? esc(w.label) : '') + '</span></button>';
      }).join('') + '</div><p class="small muted" id="d-cols-cap" style="margin:8px 0 0">' + t('Minggu {w}: <b>{n}</b> selesai · MTTR {m} mnt. Tap batang untuk detail.', { w: esc(last.label), n: last.count, m: mnt(last.mttr) }) + '</p></div>';

    var mttrSub = function (i) { return i.mttr != null ? t('MTTR {m} mnt', { m: Math.round(i.mttr) }) : ''; };
    var freqSub = function (i) { return t('{d} total', { d: dur(i.minutes * 60000) }) + (i.mttr != null ? ' · ' + mttrSub(i) : ''); };
    var longSub = function (i) { return t('{n}× rusak', { n: i.count }) + (i.mttr != null ? ' · ' + t('rata-rata {m} mnt', { m: Math.round(i.mttr) }) : ''); };
    html += rankList('5 line tersering rusak', d.linesFreq || [], {
      note: t('Jumlah kerusakan di periode ini (termasuk yang masih berjalan). Paling menurunkan MTBF.'), sub: freqSub
    });
    html += rankList('5 line terlama diperbaiki', d.linesLong || [], {
      note: t('Total waktu aktif perbaikan di periode ini. Paling menaikkan MTTR.'), sub: longSub, byMinutes: true
    });
    html += rankList('Masalah terbanyak', d.problems, { sub: mttrSub });
    html += rankList('Jenis kerusakan', d.jenis || [], { note: t('Pekerjaan selesai di periode ini.'), sub: mttrSub });
    html += rankList('Sparepart paling sering dipakai', d.parts || [], {
      note: t('Berapa kali dipakai (jumlah pekerjaan). Data dari sheet <b>Pemakaian Sparepart</b>.'),
      sub: function (i) { return t('total {n}', { n: i.qty }) + ' · ' + L(i.jenis); }
    });

    html += '<div class="card"><div class="caps">Teknisi</div>' + (d.techs.length ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>Teknisi</th><th>Selesai</th><th>MTTR</th><th>Total aktif</th></tr></thead><tbody>' +
      d.techs.map(function (x) {
        return '<tr><td>' + esc(x.key) + '</td><td>' + x.count + '</td><td>' + (x.mttr != null ? esc(t('{n} mnt', { n: mnt(x.mttr) })) : '–') + '</td><td>' + esc(dur(x.minutes * 60000)) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty small">Belum ada data di periode ini.</div>') + '</div>';

    if (d.others.length) {
      html += rankList('Isian "Lainnya" terbanyak', d.others, {
        note: t('Yang sering muncul sebaiknya dijadikan pilihan tetap di sheet <b>Pilihan</b> supaya teknisi cukup tap.')
      });
    }
    if (isAdmin()) {
      html += '<div class="card"><div class="caps">Laporan format Excel</div><p class="small muted" style="margin:6px 0 12px">' +
        t('Tab <b>Laporan {y}</b> & <b>Rekap</b> di Google Sheet diperbarui langsung setiap aksi. Tekan tombol ini setelah mengedit sheet Maintenance atau Format Laporan secara manual.', { y: new Date(serverNow()).getFullYear() }) + ' ' +
        t('Tab <b>TPM &lt;project&gt;</b> (format Excel manager, 中文 + English) diperbarui tiap malam dan saat tombol ini ditekan.') + '</p>' +
        '<button class="btn ghost" id="d-report">Perbarui Laporan, Rekap, TPM & KPI</button><div id="d-report-out"></div></div>';
    }
    if (d.warnings.length) {
      html += '<div class="card"><div class="caps" style="color:var(--warn)">' + t('Perlu dicek di Google Sheet ({n})', { n: d.warnings.length }) + '</div><ul class="small" style="margin:10px 0 0;padding-left:18px">' +
        d.warnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>';
    }
    $('d-body').innerHTML = html;
    if ($('d-close')) $('d-close').onclick = function () { closeMonth(this); };
    if ($('d-report')) $('d-report').onclick = function () {
      var b = this;
      busy(b, true, t('Membuat laporan…'));
      call('apiBuildReports').then(function (res) {
        busy(b, false);
        var tpm = (res.tpm || []).map(function (s) { return s.sheet + ' (' + s.rows + ')'; }).join(', ');
        $('d-report-out').innerHTML = '<p class="small" style="margin:10px 0 0">' + esc(t('✓ {l} ({n} baris) & {r} diperbarui.', { l: res.laporan, n: res.rows, r: res.rekap })) + ' ' +
          (tpm ? esc(t('✓ TPM: {s}.', { s: tpm })) + ' ' : '') +
          (res.tpmError ? '<span style="color:var(--warn)">' + esc(t('TPM gagal: {e}', { e: res.tpmError })) + '</span> ' : '') +
          (res.tpmWarn ? '<span style="color:var(--warn)">' + esc(res.tpmWarn) + '</span> ' : '') +
          (res.tpmUntranslated ? esc(t('{n} teks belum diterjemahkan (kuota Google); tekan lagi nanti.', { n: res.tpmUntranslated })) + ' ' : '') +
          (res.kpi ? esc(t('✓ {s} diperbarui.', { s: res.kpi })) + ' ' : '') +
          (res.kpiError ? '<span style="color:var(--warn)">' + esc(t('KPI gagal: {e}', { e: res.kpiError })) + '</span> ' : '') +
          '<a href="' + esc(res.spreadsheetUrl) + '" target="_blank" style="color:var(--accent)">Buka Google Sheet</a></p>';
      }).catch(function (e) { busy(b, false); toast(cleanErr(e), 'err'); });
    };
    var cols = document.querySelectorAll('#d-cols .col');
    for (var i = 0; i < cols.length; i++) {
      cols[i].onclick = function () {
        var w = d.weeks[Number(this.getAttribute('data-i'))];
        for (var j = 0; j < cols.length; j++) cols[j].classList.toggle('sel', cols[j] === this);
        $('d-cols-cap').innerHTML = t('Minggu {w}: <b>{n}</b> selesai · MTTR {m} mnt', { w: esc(w.label), n: w.count, m: mnt(w.mttr) });
      };
    }
  }

  // ---------- PANDUAN (teks di Panduan.html + catatan admin dari sheet Catatan Panduan) ----------

    markSeen();
    setView('guide');
    renderGuide();

      '</div><h1>Panduan</h1></div></div>' +
      (isAdmin() ? '<div style="margin:0 0 14px">' + chips('gsec', [{ value: 'teknisi', label: 'Untuk teknisi' }, { value: 'admin', label: 'Untuk admin' }], { selected: sec, big: true }) + '</div>' : '') +

          '<div class="small" style="white-space:pre-line" data-tr>' + esc(r.isi) + '</div></details>';

  // ---------- SARAN (teknisi → admin) ----------
  function openSaran() {
    closeSheet();
    setView('saran');
    $('view-saran').innerHTML = '<div class="loading">Memuat…</div>';
    call('apiSaranList').then(renderSaran).catch(function (e) { $('view-saran').innerHTML = '<div class="alert err">' + esc(cleanErr(e)) + '</div>'; });
  }
  function saranCard(s, isAdm) {
    var showTr = isAdm && s.terjemahan;
    return '<div class="card saran" data-sid="' + esc(s.id) + '" data-trbox><div class="row between"><span class="tag-lite">' + esc(s.kategori) + '</span>' +
      '<span class="pill sr-' + esc(s.status) + '">' + esc(s.status) + '</span></div>' +
      '<div class="small muted" style="margin:6px 0">' + esc(s.nama) + ' · ' + esc(fmtShort(s.whenIso)) + '</div>' +
      '<div style="white-space:pre-line"' + (showTr ? '' : ' data-tr') + '>' + esc(s.isi) + '</div>' +
      (showTr ? '<div class="small muted" style="margin-top:6px;white-space:pre-line">' + t('Terjemahan: {x}', { x: esc(s.terjemahan) }) + '</div>' : '') +
      (s.tanggapan ? '<div class="reply"><b>' + esc(s.oleh || 'Admin') + ':</b> <span data-tr>' + esc(s.tanggapan) + '</span></div>' : '') +
      (isAdm ? '<div class="stack" style="margin-top:12px">' + chips('sst', state.saran.statuses, { selected: s.status }) +
        '<textarea data-f="tanggapan" maxlength="1000" placeholder="Tanggapan untuk teknisi (opsional)">' + esc(s.tanggapan) + '</textarea>' +
        '<button class="btn ghost" data-sr-save>Simpan tanggapan</button></div>' : '') + '</div>';
  }
  function renderSaran(res) {
    state.saran = res;
    var kat = state.saranKat && res.kategori.indexOf(state.saranKat) !== -1 ? state.saranKat : res.kategori[0];
    var html = '<button class="back" id="sr-back">← Beranda</button><div class="hello"><div><div class="hi">' + (res.isAdmin ? 'Semua saran teknisi' : 'Untuk admin') +
      '</div><h1>Saran</h1></div></div>' +
      '<div class="card stack" id="sr-form"><div class="caps">Kirim saran</div><p class="small muted" style="margin:4px 0 0">Apa yang perlu ditambah atau diperbaiki di aplikasi? Boleh pakai bahasa apa saja.</p>' +
      chips('skat', res.kategori, { selected: kat }) +
      '<textarea id="sr-isi" maxlength="1000" placeholder="Tulis saran…"></textarea><button class="btn" id="sr-send">Kirim saran</button></div>' +
      '<div class="caps" style="margin:4px 4px 8px">' + t(res.isAdmin ? 'Semua saran ({n})' : 'Saran saya ({n})', { n: res.items.length }) + '</div>' +
      (res.items.length ? res.items.map(function (s) { return saranCard(s, res.isAdmin); }).join('') : '<div class="empty">Belum ada saran.</div>');
    $('view-saran').innerHTML = html;
    $('sr-back').onclick = function () { showTab('home'); };
    bindChips($('sr-form'), function (n, v) { state.saranKat = v; });
    $('sr-send').onclick = function () {
      var b = this, isi = $('sr-isi').value.trim();
      if (!isi) { toast('Tulis saranmu dulu.', 'err'); $('sr-isi').focus(); return; }
      busy(b, true, t('Mengirim…'));
      call('apiSaranKirim', { kategori: chipVal($('sr-form'), 'skat'), isi: isi }).then(function (r) {
        toast('Terima kasih! Saran terkirim ke admin.', 'ok');
        renderSaran(r);
        refresh();
      }).catch(function (e) { busy(b, false); toast(cleanErr(e), 'err'); });
    };
    var cards = $('view-saran').querySelectorAll('.card.saran');
    for (var i = 0; i < cards.length; i++) {
      (function (card) {
        bindChips(card);
        trButton(card);
        var save = card.querySelector('[data-sr-save]');
        if (save) save.onclick = function () {
          var b = this;
          busy(b, true, t('Menyimpan…'));
          call('apiSaranTanggapi', card.getAttribute('data-sid'), { status: chipVal(card, 'sst'), tanggapan: card.querySelector('[data-f="tanggapan"]').value })
            .then(function (r) { toast('Tanggapan tersimpan.', 'ok'); renderSaran(r); refresh(); })
            .catch(function (e) { busy(b, false); toast(cleanErr(e), 'err'); });
        };
      })(cards[i]);
    }
  }

  // ---------- QR (Admin) ----------
  /** Library QR hanya dimuat saat halaman QR dibuka (tidak memperlambat teknisi). */
  var qrLibPromise = null;
  function loadQrLib() {
    if (window.QRCode) return Promise.resolve();
    if (qrLibPromise) return qrLibPromise;
    qrLibPromise = new Promise(function (resolve) {
      var sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      sc.onload = resolve;
      sc.onerror = function () { qrLibPromise = null; resolve(); }; // tanpa library: URL ditampilkan sebagai teks
      document.head.appendChild(sc);
    });
    return qrLibPromise;
  }

  function loadQr() {
    $('view-qr').innerHTML = '<div class="loading">Memuat line…</div>';
    Promise.all([call('apiListLinesForQr'), loadQrLib()]).then(function (all) {
      var res = all[0];
      var base = res.baseUrl || '';
      var devWarn = /\/dev$/.test(base) ? '<div class="alert warn">URL saat ini /dev (hanya untuk editor). Buka dari URL deployment /exec sebelum mencetak QR.</div>' : '';
      var qrs = [];
      var html = '<button class="back no-print" id="qr-back">← Dashboard</button><div class="hello no-print"><div><div class="hi">Admin</div><h1>QR Line</h1></div>' +
        '<button class="btn" style="width:auto" onclick="window.print()">Cetak</button></div>' + devWarn +
        '<p class="small muted no-print" style="margin:0 4px 14px">' + t('Satu QR per baris sheet <b>Lines</b> (satu unit kerja). QR mesin lama tetap bisa dipakai: membuka line-nya.') + '</p>' +
        '<div class="qr-grid">';
      res.lines.forEach(function (l) {
        qrs.push({ url: base + '?line=' + encodeURIComponent(l.id) });
        html += '<div class="qr-card"><b style="font-size:18px">' + esc(l.id) + '</b><div class="small">' + esc(l.name) + '</div>' +
          '<div class="qr" id="qr-' + (qrs.length - 1) + '"></div><div class="small muted">' + esc([l.factoryName, l.proses, l.area].filter(String).join(' · ')) + '</div>' +
          '<div class="tiny muted notr">Scan: status & mulai kerja<br>扫码：查看状态 / 开始维修</div>' + (l.active ? '' : '<div class="small notr" style="color:var(--danger)">NONAKTIF · 已停用</div>') + '</div>';
      });
      html += '</div>';
      $('view-qr').innerHTML = html;
      $('qr-back').onclick = function () { showTab('dashboard'); };
      qrs.forEach(function (q, i) {
        if (window.QRCode) new QRCode($('qr-' + i), { text: q.url, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M });
        else $('qr-' + i).innerHTML = '<div class="small" style="word-break:break-all">' + esc(q.url) + '</div>';
      });
    }).catch(function (e) { $('view-qr').innerHTML = '<div class="alert err">' + esc(cleanErr(e)) + '</div>'; });
  }

  boot();
})();
</script>
