<script>
(function () {
  'use strict';

  var QR_FRESH_MS = 15 * 60 * 1000;  // entri via QR dianggap "sedang di mesin" selama 15 menit
  var FILTER_KEY = 'mttr21.filter';
  var SEEN_KEY = 'mttr.versiDilihat';   // badge "Versi baru" muncul sekali setelah update
  var NO_PART = 'Tidak ada pergantian';
  var OTHER = 'Lainnya';
  var EVENT_LABEL = {
    'start': 'Mulai', 'pause': 'Pause', 'resume': 'Lanjut kerja', 'pending': 'Pending', 'lanjut': 'Pending dilanjutkan',
    'complete': 'Selesai', 'cancel': 'Cancel', 'peringatan': 'Peringatan', 'masih lanjut': 'Konfirmasi masih lanjut',
    'abandoned': 'Abandoned', 'review': 'Review'
  };

  function emptyFilter() { return { factory: '', proses: '', baterai: '', line: '' }; }
  function loadFilter() {
    try { var f = JSON.parse(localStorage.getItem(FILTER_KEY) || '{}'); return { factory: f.factory || '', proses: f.proses || '', baterai: f.baterai || '', line: f.line || '' }; }
    catch (e) { return emptyFilter(); }
  }
  function saveFilter() {
    try { localStorage.setItem(FILTER_KEY, JSON.stringify(state.filter)); } catch (e) { /* mode privat: abaikan */ }
  }

  var state = {
    boot: null,
    offsetMs: 0,            // serverNow - deviceNow: timer layar mengikuti jam server
    tab: 'home',
    lineView: null,
    qr: INITIAL_LINE_ID ? { line: INITIAL_LINE_ID.toUpperCase(), at: Date.now() } : null,
    filter: loadFilter(),   // dipakai bersama Beranda, Pending, Review, Riwayat, Dashboard
    q: { pending: '', review: '', history: '' },
    pendingFilter: 'ALL',
    history: { status: '', tipe: '', scope: 'mine', data: null },
    dash: { periode: 30, mode: 'ringkasan' },
    stat: { by: 'line', measure: 'frek', p: { kind: 'bulan' } },   // Dashboard → Statistik (2.6)
    dl: { kind: 'bulan' },                                         // Riwayat → Download (2.6)
    sheetClose: null
  };

  // ---------- util ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        var msg = (e && e.message) || String(e);
        // Halaman sudah lolos cek akses (doGet), jadi ditolak sekarang = Google memakai akun lain (multi-akun).
        var denied = /ACCESS_DENIED: email (\S+)/.exec(msg);
        if (cekAkunOn() && (AUTH_ERR.test(msg) || (denied && (!state.boot || denied[1] !== state.boot.user.email)))) accountProblem(denied ? denied[1] : '');
        reject(new Error(msg));
      });
      r[fn].apply(r, args);
    });
  }

  // ---------- Bug Google: browser login beberapa akun → google.script.run memakai akun utama browser ----------
  var AUTH_ERR = /PERMISSION_DENIED|authoriz|HTTP 40[13]/i;
  /** Admin bisa mematikan pemeriksaan lewat Config → CEK_AKUN = Tidak. */
  function cekAkunOn() { return !state.boot || state.boot.cekAkun !== false; }
  function accountProblem(other) {
    if ($('acct')) return;
    var mine = state.boot && state.boot.user ? state.boot.user.email : '';
    var d = document.createElement('div');
    d.id = 'acct';
    d.className = 'acct-bg';
    d.innerHTML = '<div class="card acct">' + (other && mine
      ? '<h2>' + t('Akun Google tidak cocok') + '</h2><p class="small">' + t('Aplikasi dibuka sebagai {a}, tetapi Google mengirim tombol sebagai {b} (akun utama di browser ini). Ini bug Google saat satu browser login dengan beberapa akun. Aplikasi dihentikan supaya data tidak tercatat atas nama yang salah.',
        { a: '<b>' + esc(mine) + '</b>', b: '<b>' + esc(other) + '</b>' }) + '</p>'
      // Tanpa info akun: bisa juga sesi login habis / sinyal → muat ulang dulu.
      : '<h2>' + t('Tidak terhubung ke akun Google') + '</h2><p class="small">' + t('Google menolak permintaan dari browser ini{u}. Tekan <b>Muat ulang</b> dulu (mungkin sesi login habis). Kalau masih muncul, biasanya karena browser login dengan beberapa akun Google:',
        { u: mine ? t(' untuk {e}', { e: '<b>' + esc(mine) + '</b>' }) : '' }) + '</p>') +
      '<ol class="small"><li>' + t('<b>Cepat:</b> buka link aplikasi di tab <b>Incognito / Private</b>, login hanya dengan akun kerja.') + '</li>' +
      '<li>' + t('<b>Permanen di HP:</b> pakai satu browser khusus kerja (mis. Firefox, Edge, Samsung Internet) yang hanya login akun kerja, lalu ⋮ → <b>Tambahkan ke layar utama</b>.') + '</li>' +
      '<li>' + t('<b>Permanen di PC:</b> buat <b>profil Chrome</b> khusus akun kerja, atau keluar dari semua akun lalu login akun kerja <b>paling dulu</b> (akun pertama = akun utama).') + '</li></ol>' +
      '<button class="btn" id="acct-reload">' + t('Muat ulang') + '</button></div>';
    document.body.appendChild(d);
    $('acct-reload').onclick = function () { location.reload(); };
  }
  /** Bandingkan akun halaman (dari doGet) dengan akun yang dipakai Google untuk tombol. */
  function checkAccount() {
    if (!cekAkunOn()) return;
    call('apiWhoAmI').then(function (email) {
      if (email && state.boot && email !== state.boot.user.email) accountProblem(email);
    }).catch(function () { /* penolakan sudah ditangani di call() */ });
  }
  function cleanErr(e) { return String((e && e.message) || e).replace(/^(Error|Exception):\s*/, ''); }
  function syncClock(iso) { if (iso) state.offsetMs = new Date(iso).getTime() - Date.now(); }
  function serverNow() { return Date.now() + state.offsetMs; }
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function hms(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return two(Math.floor(s / 3600)) + ':' + two(Math.floor(s % 3600 / 60)) + ':' + two(s % 60);
  }
  function dur(ms) {
    var m = Math.max(0, Math.floor(ms / 60000)), zh = LANG === 'zh';
    if (m < 60) return m + (zh ? '分' : 'm');
    var h = Math.floor(m / 60);
    if (h < 24) return h + (zh ? '时 ' : 'j ') + (m % 60) + (zh ? '分' : 'm');
    return Math.floor(h / 24) + (zh ? '天 ' : ' hari ') + (h % 24) + (zh ? '时' : 'j');
  }
  function ago(iso) {
    var ms = serverNow() - new Date(iso).getTime();
    if (ms < 60000) return t('baru saja');
    return t('{d} lalu', { d: dur(ms) });
  }
  function fmtShort(iso) {
    if (!iso) return '-';
    var d = new Date(new Date(iso).getTime() + 7 * 3600000); // WIB, tanpa DST
    return two(d.getUTCDate()) + '/' + two(d.getUTCMonth() + 1) + ' ' + two(d.getUTCHours()) + ':' + two(d.getUTCMinutes());
  }
  function mnt(v) { return v == null ? '–' : Math.round(v) + ''; }
  /** Angka jam KPI: 1 desimal di bawah 100 (koma untuk Bahasa Indonesia), bulat di atasnya. */
  function jam(v) {
    if (v == null) return '–';
    var s = v >= 100 ? String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ',') : (Math.round(v * 10) / 10).toFixed(1);
    return LANG === 'zh' ? s : s.replace(/[.,]/g, function (c) { return c === '.' ? ',' : '.'; });   // id: 4.416 · 1,5
  }
  // ---------- periode (Statistik & Download): hari ini / tanggal / bulan / tahun / rentang, tanggal WIB ----------
  var BULAN_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  function todayKey() { var d = new Date(serverNow() + 7 * 3600000); return d.getUTCFullYear() + '-' + two(d.getUTCMonth() + 1) + '-' + two(d.getUTCDate()); }
  /** @param {{kind:string, date?, month?, year?, from?, to?}} p @return {{from:string, to:string}} 'yyyy-mm-dd', inklusif */
  function periodRange(p) {
    var today = todayKey(), ok = function (v, re) { return re.test(v || '') ? v : ''; };
    if (p.kind === 'tanggal') { var d = ok(p.date, /^\d{4}-\d\d-\d\d$/) || today; return { from: d, to: d }; }
    if (p.kind === 'bulan') {
      var m = ok(p.month, /^\d{4}-\d\d$/) || today.slice(0, 7);
      return { from: m + '-01', to: m + '-' + two(new Date(Date.UTC(Number(m.slice(0, 4)), Number(m.slice(5)), 0)).getUTCDate()) };
    }
    if (p.kind === 'tahun') { var y = ok(String(p.year || ''), /^\d{4}$/) || today.slice(0, 4); return { from: y + '-01-01', to: y + '-12-31' }; }
    if (p.kind === 'rentang') {
      var a = ok(p.from, /^\d{4}-\d\d-\d\d$/) || today, b = ok(p.to, /^\d{4}-\d\d-\d\d$/) || today;
      return a <= b ? { from: a, to: b } : { from: b, to: a };
    }
    return { from: today, to: today };
  }
  function periodText(p) {
    var r = periodRange(p), dm = function (k) { return k.slice(8) + '/' + k.slice(5, 7) + '/' + k.slice(0, 4); };
    if (p.kind === 'bulan') return monthLabel(r.from.slice(0, 7), BULAN_ID[Number(r.from.slice(5, 7)) - 1] + ' ' + r.from.slice(0, 4));
    if (p.kind === 'tahun') return r.from.slice(0, 4);
    return r.from === r.to ? dm(r.from) : dm(r.from) + ' – ' + dm(r.to);
  }
  /** Pilihan periode di dalam `box`; p diubah langsung, onChange() setiap kali berubah. */
  function bindPeriod(box, prefix, p, onChange) {
    var draw = function () {
      var today = todayKey(), y = Number(today.slice(0, 4)), r = periodRange(p), input = '';
      if (p.kind === 'tanggal') input = '<input type="date" data-p="date" value="' + esc(r.from) + '" max="' + today + '">';
      if (p.kind === 'bulan') input = '<input type="month" data-p="month" value="' + esc(r.from.slice(0, 7)) + '" max="' + today.slice(0, 7) + '" placeholder="yyyy-mm">';
      if (p.kind === 'tahun') input = '<select data-p="year">' + [y, y - 1, y - 2].map(function (v) { return '<option' + (String(v) === r.from.slice(0, 4) ? ' selected' : '') + '>' + v + '</option>'; }).join('') + '</select>';
      if (p.kind === 'rentang') input = '<div class="row"><input type="date" data-p="from" value="' + esc(r.from) + '" max="' + today + '"><span class="muted">–</span>' +
        '<input type="date" data-p="to" value="' + esc(r.to) + '" max="' + today + '"></div>';
      box.innerHTML = '<div class="scroll-x">' + chips(prefix + '-kind', [{ value: 'hari', label: 'Hari ini' }, { value: 'tanggal', label: 'Tanggal' }, { value: 'bulan', label: 'Bulan' },
        { value: 'tahun', label: 'Tahun' }, { value: 'rentang', label: 'Rentang' }], { selected: p.kind || 'hari' }) + '</div>' + (input ? '<div style="margin-top:8px">' + input + '</div>' : '');
      bindChips(box, function (n, v) { p.kind = v; draw(); onChange(); });
      [].forEach.call(box.querySelectorAll('[data-p]'), function (el) {
        el.onchange = function () { p[el.getAttribute('data-p')] = el.value; onChange(); };
      });
    };
    draw();
  }

  /** "2026-09" → "September 2026" / "2026年9月" */
  function monthLabel(key, idLabel) {
    var m = /^(\d{4})-(\d{2})$/.exec(key || '');
    return m && LANG === 'zh' ? m[1] + '年' + Number(m[2]) + '月' : (idLabel || key);
  }
  function initials(name) {
    return String(name || '?').split(/[\s@.]+/).filter(String).slice(0, 2).map(function (p) { return p[0]; }).join('').toUpperCase() || '?';
  }
  function pill(st) { return '<span class="pill st-' + esc(st) + '">' + esc(st) + '</span>'; }
  function tipeTag(t) { return t && t !== 'Corrective' ? ' <span class="tag-lite">' + esc(t) + '</span>' : ''; }
  function isAdmin() { return state.boot && state.boot.user.role === 'Admin'; }
  function me() { return state.boot.user; }
  function M() { return state.boot.master; }
  function busy(btn, on, label) {
    if (!btn) return;
    if (on) { btn.dataset.label = btn.innerHTML; btn.innerHTML = label || t('Memproses…'); btn.disabled = true; }
    else if (btn.dataset.label) { btn.innerHTML = btn.dataset.label; btn.disabled = false; }
  }
  var toastTimer;
  function toast(msg, kind) {
    clearTimeout(toastTimer);
    $('toast-root').innerHTML = '<div class="toast ' + (kind || '') + '">' + esc(msg) + '</div>';
    toastTimer = setTimeout(function () { $('toast-root').innerHTML = ''; }, kind === 'err' ? 6000 : 3000);
    // Pesan error dari server berbahasa Indonesia → untuk user 中文 diterjemahkan (Google Translate, di-cache).
    if (kind === 'err' && LANG === 'zh' && needsTr(msg) && !I18N_DICT[msg]) {
      translateTexts([msg]).then(function (o) {
        var el = $('toast-root').querySelector('.toast');
        if (el && el.textContent === msg) el.textContent = o[0];
      }).catch(function () { /* tetap tampil bahasa Indonesia */ });
    }
  }
  function freshQr(line) {
    return state.qr && state.qr.line === String(line).toUpperCase() && Date.now() - state.qr.at < QR_FRESH_MS;
  }
  function who(name) { return name === 'Sistem' ? t('Sistem') : name; }
  function lineTitle(r) { return esc(r.line) + (r.mesin ? ' · ' + esc(L(r.mesin)) : (r.lineName ? ' · ' + esc(L(r.lineName)) : '')); }

  // ---------- bahasa: id / 中文 (kamus & penerjemah tampilan di I18n.html) ----------
  var LANG_KEY = 'mttr.bahasa';
  function savedLang() { try { return localStorage.getItem(LANG_KEY) || ''; } catch (e) { return ''; } }
  /** Label tampilan untuk nilai dari Google Sheet (pilihan, mesin, line). Nilai yang disimpan tidak berubah. */
  function L(v) {
    if (LANG !== 'zh' || !v) return v;
    var m = /^Lainnya: ([\s\S]*)$/.exec(String(v));
    return m ? t('Lainnya') + ': ' + m[1] : (I18N_DICT[v] || v);
  }
  function lbl(d) { return LANG === 'zh' && d.labelZh ? d.labelZh : d.label; }
  /** Nilai pilihan; "Lainnya: teks bebas" → label + teks yang bisa diterjemahkan (tombol 翻译). */
  function valHtml(v) {
    var m = /^Lainnya: ([\s\S]*)$/.exec(String(v || ''));
    return m ? esc(t('Lainnya')) + ': <span data-tr>' + esc(m[1]) + '</span>' : esc(L(v));
  }
  /**
   * Detail log dari server (teks Indonesia berpola) → label baku lewat kamus, teks bebas tetap asli di [data-tr] (tombol 翻译).
   * Mulai: "Corrective, Line L01, mesin X, baterai Y, stop line Ya, …"; lainnya: "Label: nilai · Tenggat … · …".
   */
  function logHtml(event, s) {
    s = String(s || '');
    if (!s) return '';
    var byAdmin = / \(oleh Admin\)$/.test(s), sep = event === 'start' ? ', ' : ' · ';
    if (byAdmin) s = s.replace(/ \(oleh Admin\)$/, '');
    var val = function (v) { return LANG === 'zh' && (I18N_DICT[v] || /^Lainnya: /.test(v)) ? esc(L(v)) : '<span data-tr>' + esc(v) + '</span>'; };
    var seg = function (x) {
      var m;
      if ((m = /^Line (.+)$/.exec(x))) return esc(t('Line')) + ' ' + esc(m[1]);
      if ((m = /^mesin (.+)$/.exec(x))) return esc(t('Mesin')) + ' ' + val(m[1]);
      if ((m = /^baterai (.+)$/.exec(x))) return esc(t('Baterai')) + ' ' + esc(m[1]);
      if ((m = /^stop line (.+)$/.exec(x))) return esc(t('Stop line')) + ' ' + esc(t(m[1]));
      if ((m = /^Tenggat (.+)$/.exec(x))) return esc(t('Tenggat {w}', { w: m[1] }));
      if ((m = /^> (\d+) jam tanpa konfirmasi \((.+)\)$/.exec(x))) return esc(t('> {h} jam tanpa konfirmasi ({s})', { h: m[1], s: t(m[2]) }));
      if ((m = /^Konfirmasi QR (.+)$/.exec(x))) return esc(t('Konfirmasi QR {l}', { l: m[1] }));
      if ((m = /^Status (\w+)$/.exec(x))) return esc(t('Status {s}', { s: t(m[1]) }));
      if (I18N_DICT[x] != null) return esc(t(x));
      if ((m = /^([^:]{1,80}): ([\s\S]*)$/.exec(x))) return esc(t(m[1])) + (LANG === 'zh' ? '：' : ': ') + val(m[2]);
      return val(x);
    };
    return s.split(sep).map(seg).join(LANG === 'zh' && sep === ', ' ? '，' : sep) + (byAdmin ? esc(t(' (oleh Admin)')) : '');
  }
  function masterDict(m) {
    var d = {};
    Object.keys(m.trZh || {}).forEach(function (k) { d[k] = m.trZh[k]; });
    Object.keys(m.forms || {}).forEach(function (f) { m.forms[f].forEach(function (x) { if (x.labelZh) d[x.label] = x.labelZh; }); });
    return d;
  }
  function applyLang(lang) {
    i18nSet(lang, state.boot ? masterDict(M()) : {});
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'id';
    var st = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < st.length; i++) st[i].textContent = t(st[i].getAttribute('data-i18n'));
  }
  function setLang(lang) {
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* mode privat: hanya sesi ini */ }
    applyLang(lang);
    closeSheet();
    if (state.lineView && state.tab === 'home') { setView('line'); renderLine(); } else showTab(state.tab);
  }
  function langBtn() { return '<button class="helpbtn lang" id="btn-lang" aria-label="Bahasa / 语言">' + (LANG === 'zh' ? 'ID' : '中') + '</button>'; }

  // Tombol 翻译 / Terjemahkan untuk teks bebas ([data-tr]): teks Indonesia → 中文 untuk user zh, teks 中文 → Indonesia.
  var trCache = {};
  function needsTr(s) { s = String(s || '').trim(); return !!s && (LANG === 'zh' ? !/[\u3400-\u9fff]/.test(s) : /[\u3400-\u9fff]/.test(s)); }
  function translateTexts(texts) {
    var lang = LANG, need = [];
    texts.forEach(function (s) { if (trCache[lang + '|' + s] == null && need.indexOf(s) === -1) need.push(s); });
    var chunks = [];
    for (var i = 0; i < need.length; i += 50) chunks.push(need.slice(i, i + 50));   // apiTranslate: maks 50 teks per panggilan
    var p = Promise.all(chunks.map(function (c) {
      return call('apiTranslate', c, lang).then(function (out) { c.forEach(function (s, j) { trCache[lang + '|' + s] = out[j]; }); });
    }));
    return p.then(function () { return texts.map(function (s) { return trCache[lang + '|' + s]; }); });
  }
  function trButton(root) {
    if (!root) return;
    var els = Array.prototype.filter.call(root.querySelectorAll('[data-tr]'), function (e) { return needsTr(e.textContent); });
    if (!els.length) return;
    var b = document.createElement('button'), shown = false, label = t('🌐 Terjemahkan');
    b.type = 'button'; b.className = 'link small trbtn'; b.textContent = label;
    root.appendChild(b);
    b.onclick = function (ev) {
      ev.stopPropagation();
      if (shown) { els.forEach(function (e) { e.textContent = e.getAttribute('data-orig'); }); shown = false; b.textContent = label; return; }
      var texts = els.map(function (e) { if (!e.hasAttribute('data-orig')) e.setAttribute('data-orig', e.textContent); return e.getAttribute('data-orig'); });
      busy(b, true, t('Menerjemahkan…'));
      translateTexts(texts).then(function (out) {
        busy(b, false);
        els.forEach(function (e, i) { e.textContent = out[i]; });
        shown = true;
        b.textContent = t('Tampilkan teks asli');
      }).catch(function (e) { busy(b, false); toast(cleanErr(e), 'err'); });
    };
  }

  // ---------- live timers (tampilan saja; data dari server) ----------
  function liveMs(el) {
    var ms = parseFloat(el.getAttribute('data-base') || '0') * 60000;
    if (el.getAttribute('data-run') === '1') ms += serverNow() - new Date(el.getAttribute('data-since')).getTime();
    return ms;
  }
  function timerAttrs(baseMin, sinceIso, running) {
    return ' data-base="' + esc(baseMin) + '" data-since="' + esc(sinceIso) + '" data-run="' + (running ? 1 : 0) + '"';
  }
  function tick() {
    var i, els = document.querySelectorAll('.js-hms');
    for (i = 0; i < els.length; i++) els[i].textContent = hms(liveMs(els[i]));
    els = document.querySelectorAll('.js-dur');
    for (i = 0; i < els.length; i++) els[i].textContent = dur(liveMs(els[i]));
    els = document.querySelectorAll('.js-ago');
    for (i = 0; i < els.length; i++) els[i].textContent = ago(els[i].getAttribute('data-iso'));
  }
  setInterval(tick, 1000);

  // ---------- navigation ----------
  $('tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-tab]');
    if (b) showTab(b.getAttribute('data-tab'));
  });

  function setView(id) {
    ['home', 'line', 'history', 'review', 'pending', 'dashboard', 'qr', 'guide', 'saran'].forEach(function (v) {
      $('view-' + v).classList.toggle('hidden', v !== id);
    });
    window.scrollTo(0, 0);
  }
  function markTab(tab) {
    var btns = document.querySelectorAll('nav.tabs button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === tab);
  }

  function showTab(tab) {
    closeSheet();
    state.tab = tab;
    markTab(tab);
    if (tab === 'home') { state.lineView = null; setView('home'); renderHome(); refresh(); }
    if (tab === 'history') { setView('history'); loadHistory(); }
    if (tab === 'review') { setView('review'); loadReview(); }
    if (tab === 'pending') { setView('pending'); loadPending(); }
    if (tab === 'dashboard') { setView('dashboard'); loadDashboard(); }
  }
  function reloadTab() {
    if (state.tab === 'home') { refresh(true); return; }
    showTab(state.tab);
  }

  function setBadges(c) {
    $('badge-pending').innerHTML = c.pending ? '<span class="badge">' + c.pending + '</span>' : '';
    $('badge-review').innerHTML = c.review ? '<span class="badge">' + c.review + '</span>' : '';
  }

  // ---------- master: factory → baterai → line ----------
  function factoryName(id) {
    var f = M().factories.filter(function (x) { return x.id === id; })[0];
    return f ? f.name : id;
  }
  function batteriesFor(factory) {
    var out = [];
    M().projects.forEach(function (p) {
      if ((!factory || p.factory === factory) && out.indexOf(p.battery) === -1) out.push(p.battery);
    });
    return out;
  }
  function linesFor(f, q) {
    q = String(q || '').trim().toLowerCase();
    return M().lines.filter(function (l) {
      if (f.factory && l.factory !== f.factory) return false;
      if (f.proses && l.proses !== f.proses) return false;
      if (f.baterai && l.batteries.indexOf(f.baterai) === -1) return false;
      if (f.line && l.id !== f.line) return false;
      if (q && [l.id, l.name, L(l.name), l.proses, l.area, factoryName(l.factory)].join(' ').toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }
  /** Daftar Proses (grup di atas Line, kolom Proses di sheet Lines). */
  function prosesFor(factory) {
    var out = [];
    M().lines.forEach(function (l) { if (l.proses && (!factory || l.factory === factory) && out.indexOf(l.proses) === -1) out.push(l.proses); });
    return out.sort();
  }
  /** Pilihan "Line" di filter. */
  function lineChoices(f) {
    return linesFor({ factory: f.factory, proses: f.proses, baterai: f.baterai }).map(function (l) {
      return { value: l.id, label: l.id + (l.name ? ' · ' + L(l.name) : '') };
    });
  }
  function serverFilter(view) {
    var f = state.filter;
    return { factory: f.factory, proses: f.proses, baterai: f.baterai, line: f.line, q: view ? state.q[view] || '' : '' };
  }

  // ---------- filter bar (Beranda, Pending, Review, Riwayat, Dashboard) ----------
  function filterSummary() {
    var f = state.filter, parts = [];
    if (f.factory) parts.push(factoryName(f.factory));
    if (f.proses) parts.push(f.proses);
    if (f.baterai) parts.push(f.baterai);
    if (f.line) parts.push(f.line);
    return parts;
  }
  function filterBar(view, dark) {
    var parts = filterSummary();
    return '<div class="filterbar' + (dark ? ' on-dark' : '') + '">' +
      (view ? '<input type="search" class="search" data-search="' + view + '" placeholder="Cari line, ID, masalah…" value="' + esc(state.q[view] || '') + '">' : '') +
      '<button class="fbtn' + (parts.length ? ' on' : '') + '" data-open-filter>' +
      '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>' +
      '<span>' + (parts.length ? esc(parts.join(' · ')) : 'Filter') + '</span></button></div>';
  }
  var searchTimer;
  function bindFilterBar(root, onChange) {
    var b = root.querySelector('[data-open-filter]');
    if (b) b.onclick = function () { openFilterSheet(onChange); };
    var s = root.querySelector('[data-search]');
    if (s) s.oninput = function () {
      var v = this.value, view = this.getAttribute('data-search');
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { state.q[view] = v; onChange(true); }, 350);
    };
  }
  function openFilterSheet(onApply) {
    var draft = { factory: state.filter.factory, proses: state.filter.proses, baterai: state.filter.baterai, line: state.filter.line };
    var s = openSheet('<h2>Filter</h2><p class="small muted">Berlaku di Beranda, Pending, Review, Riwayat & Dashboard. Tersimpan di HP ini.</p><div id="f-body" class="stack"></div>' +
      '<div class="btn-row two" style="margin-top:16px"><button class="btn ghost" id="f-reset">Reset</button><button class="btn" id="f-apply">Terapkan</button></div>');
    function draw() {
      var bats = batteriesFor(draft.factory);
      if (draft.baterai && bats.indexOf(draft.baterai) === -1) draft.baterai = '';
      var pros = prosesFor(draft.factory);
      if (draft.proses && pros.indexOf(draft.proses) === -1) draft.proses = '';
      var lines = lineChoices(draft);
      if (draft.line && !lines.some(function (l) { return l.value === draft.line; })) draft.line = '';
      $('f-body').innerHTML =
        '<div><label class="lbl">Factory</label>' + chips('factory', [{ value: '', label: 'Semua' }].concat(M().factories.map(function (f) {
          return { value: f.id, label: f.name + (f.lokasi ? ' · ' + f.lokasi : '') };
        })), { selected: draft.factory }) + '</div>' +
        (pros.length ? '<div><label class="lbl">Proses</label>' + chips('proses', [{ value: '', label: 'Semua' }].concat(pros), { selected: draft.proses }) + '</div>' : '') +
        '<div><label class="lbl">Baterai / project</label>' + chips('baterai', [{ value: '', label: 'Semua' }].concat(bats), { selected: draft.baterai }) + '</div>' +
        '<div><label class="lbl">Line</label><select id="f-line"><option value="">Semua line</option>' + lines.map(function (l) {
          return '<option value="' + esc(l.value) + '"' + (l.value === draft.line ? ' selected' : '') + '>' + esc(l.label) + '</option>';
        }).join('') + '</select></div>';
      bindChips($('f-body'), function (name, val) { draft[name] = val; if (name === 'factory' || name === 'proses') { draft.line = ''; } draw(); });
      $('f-line').onchange = function () { draft.line = this.value; };
    }
    draw();
    var apply = function () { state.filter = draft; saveFilter(); closeSheet(); onApply(); };
    // Reset langsung berlaku (sebelumnya harus Terapkan juga; ditutup tanpa Terapkan = filter lama tetap aktif).
    $('f-reset').onclick = function () { draft = emptyFilter(); apply(); };
    $('f-apply').onclick = apply;
    return s;
  }

  // ---------- boot & refresh ----------
  function boot() {
    var hasFilter = !!(state.filter.factory || state.filter.proses || state.filter.baterai || state.filter.line);
    // Data awal sudah ditanam di halaman oleh server (doGet) → langsung tampil tanpa menunggu server lagi.
    i18nObserve(document.body);   // teks tetap yang masuk ke layar diterjemahkan otomatis (bila bahasa 中文)
    if (window.BOOT) {
      try { applyBoot(window.BOOT); } catch (e) { bootError(e); return; }
      checkAccount();
      if (hasFilter) refresh(true); // statistik Beranda dihitung ulang sesuai filter tersimpan
      return;
    }
    call('apiBootstrap', INITIAL_LINE_ID || '', INITIAL_MESIN_ID || '', serverFilter()).then(applyBoot).catch(bootError);
  }

  function bootError(e) {
    $('view-home').innerHTML = '<div class="card center" style="margin-top:40px"><h2>Gagal memuat</h2><p class="muted">' + esc(cleanErr(e)) +
      '</p><button class="btn" onclick="location.reload()">Coba lagi</button></div>';
  }

  function applyBoot(b) {
    state.boot = b;
    applyLang(savedLang() || b.user.lang || 'id');
    // 2.6: review = keputusan admin (Cancelled, Abandoned); teknisi tidak punya tab Review.
    var rvTab = document.querySelector('nav.tabs button[data-tab="review"]');
    if (rvTab) rvTab.classList.toggle('hidden', !isAdmin());
    syncClock(b.serverNowIso);
    setBadges(b.counts);
    // filter tersimpan yang sudah tidak valid (factory/line dihapus dari sheet) dibersihkan
    if (state.filter.factory && !M().factories.some(function (f) { return f.id === state.filter.factory; })) state.filter = emptyFilter();
    if (state.filter.proses && prosesFor('').indexOf(state.filter.proses) === -1) state.filter.proses = '';
    if (b.lineView) {
      if (b.lineView.line && !state.qr) state.qr = { line: b.lineView.line.id, at: Date.now() };
      state.lineView = b.lineView; setView('line'); renderLine();
    } else {
      renderHome();
      if (INITIAL_MESIN_ID) toast(t('QR mesin {m} tidak cocok dengan satu line. Pilih line-nya.', { m: INITIAL_MESIN_ID }), 'err');
    }
  }

  var refreshing = false;
  function refresh(force) {
    if (!state.boot || refreshing) return Promise.resolve();
    refreshing = true;
    return call('apiRefresh', serverFilter(), M().version).then(function (r) {
      syncClock(r.serverNowIso);
      if (r.updated) showUpdateBanner(r.updated, r.appUrl);
      var b = state.boot;
      var changed = force || JSON.stringify(b.myOpen) !== JSON.stringify(r.myOpen) || JSON.stringify(b.recent) !== JSON.stringify(r.recent) ||
        JSON.stringify(b.stats) !== JSON.stringify(r.stats);
      b.myOpen = r.myOpen; b.counts = r.counts; b.stats = r.stats; b.recent = r.recent;
      setBadges(r.counts);
      if (changed && state.tab === 'home' && !state.lineView && !state.sheetClose) renderHome();
    }).catch(function () { /* diam: refresh latar belakang */ }).then(function () { refreshing = false; });
  }
  setInterval(function () { if (!document.hidden) refresh(); }, 60000);

  /** Admin baru deploy versi baru: halaman lama tetap jalan, tapi sebaiknya dimuat ulang setelah isian yang terbuka disimpan. */
  function showUpdateBanner(version, url) {
    if ($('upd')) return;
    var d = document.createElement('div');
    d.id = 'upd';
    d.className = 'updbar';
    d.innerHTML = '<span class="grow">' + t('Versi baru ({v}) sudah terpasang. Simpan isian yang sedang dibuka, lalu muat ulang.', { v: esc(version) }) + '</span>' +
      (url ? '<a class="btn" href="' + esc(url) + '" target="_top">' + t('Muat ulang') + '</a>' : '<b>' + t('Tutup & buka lagi aplikasinya.') + '</b>');
    document.body.appendChild(d);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });

  // ---------- HOME ----------
  // ---------- versi & panduan ----------
  function isNewVersion() {
    try { return localStorage.getItem(SEEN_KEY) !== M().version; } catch (e) { return false; }
  }
  function markSeen() {
    try { localStorage.setItem(SEEN_KEY, M().version); } catch (e) { /* mode privat: abaikan */ }
  }
  function helpBtn() {
    return '<button class="helpbtn" data-help aria-label="Panduan">?' + (isNewVersion() ? '<span class="dot"></span>' : '') + '</button>';
  }
  function bindHelp(root) {
    var hs = root.querySelectorAll('[data-help]');
    for (var i = 0; i < hs.length; i++) hs[i].onclick = openGuide;
  }

  function renderHome() {
    var b = state.boot, u = b.user, warn = b.myOpen && b.myOpen.warnedIso;
    var html = '<div class="hello"><div><div class="appname">' + esc(M().appName) + '</div><div class="hi">' + t('Halo, {n},', { n: esc(u.name.split(' ')[0]) }) + '</div><h1>' +

    if (isNewVersion()) {
      html += '<button class="newver" data-help>' + t('<b>Versi {v}</b> · ada yang baru. Lihat panduan singkat ›', { v: esc(M().version) }) + '</button>';
    }

    if (b.myOpen) {
      html += workCard(b.myOpen);
    } else {
      html += '<div class="card dark"><div class="caps">Mulai kerja</div><h2 style="margin:6px 0 14px">Scan QR di line / mesin</h2>' +
        '<button class="btn xl" id="btn-scan">' +
        '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="vertical-align:-5px;margin-right:8px"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>SCAN QR</button>' +
        '<button class="btn ghost" id="btn-find-line" style="margin-top:10px">Cari line (jika QR rusak)</button></div>';
    }
    html += '<button class="saranbar" id="btn-saran"><span class="grow">' + (isAdmin() ? t('💡 Saran dari teknisi') : t('💡 Punya saran untuk aplikasi? Kirim ke admin')) + '</span>' +
      (isAdmin() && b.counts.saran ? '<span class="badge">' + b.counts.saran + '</span>' : '') + ' ›</button>';
    html += filterBar(null) + weekCard(b.stats) + feedCard(b.recent);
    $('view-home').innerHTML = html;
    $('btn-lang').onclick = function () { setLang(LANG === 'zh' ? 'id' : 'zh'); };
    $('btn-saran').onclick = openSaran;

    if ($('btn-scan')) $('btn-scan').onclick = scanAny;
    if ($('btn-find-line')) $('btn-find-line').onclick = linePicker;
    bindHelp($('view-home'));
    bindWork(b.myOpen, $('view-home'));
    bindFilterBar($('view-home'), function () { refresh(true); });
    var lh = $('link-history');
    if (lh) lh.onclick = function () { showTab('history'); };
    var ld = $('link-dash');
    if (ld) ld.onclick = function () { showTab('dashboard'); };
    tick();
  }

  function weekCard(st) {
    var max = Math.max(1, Math.max.apply(null, st.days.map(function (d) { return d.count; })));
    var total = st.days.reduce(function (s, d) { return s + d.count; }, 0);
    return '<div class="card"><div class="caps">' + t('Maintenance selesai 7 hari ({n})', { n: total }) + '</div>' +
      '<div class="bars">' + st.days.map(function (d) {
        return '<div class="bar" title="' + esc(t('{d}: {n} selesai', { d: t(d.label), n: d.count })) + '"><span class="n">' + (d.count || '') + '</span><div class="track"><div class="fill" style="height:' +
          Math.round(d.count / max * 100) + '%"></div></div><span class="lbl">' + esc(d.label) + '</span></div>';
      }).join('') + '</div>' +
      '<div class="kpis"><div class="kpi"><span class="tiny muted">MTTR 7 hari (Corrective)</span><b>' +
      (st.mttrMin == null ? '–' : esc(Math.round(st.mttrMin)) + '<span class="small"> mnt</span>') + '</b></div>' +
      '<div class="kpi"><span class="tiny muted">Dihitung ke MTTR</span><b>' + st.mttrN + '<span class="small"> / ' + total + '</span></b></div></div>' +
      '<p class="small row between" style="margin:14px 0 0"><button class="link" id="link-history">Lihat riwayat ›</button><button class="link" id="link-dash">Dashboard ›</button></p></div>';
  }

  function feedCard(list) {
    return '<div class="card" data-trbox><div class="caps">Aktivitas terbaru</div>' + (list.length ? '<ul class="feed">' + list.map(function (e) {
      return '<li><div class="avatar sm">' + esc(initials(e.userName)) + '</div><div class="grow">' +
        '<div class="row between small"><span class="muted">' + esc(who(e.userName)) + '</span><span class="muted js-ago" data-iso="' + esc(e.whenIso) + '">' + esc(ago(e.whenIso)) + '</span></div>' +
        '<div class="title">' + esc((e.line ? e.line + (e.mesin ? ' · ' + L(e.mesin) : '') + ' · ' : '') + t(EVENT_LABEL[e.event] || e.event)) + '</div>' +
        '<div class="small muted clamp">' + (e.detail ? logHtml(e.event, e.detail) : esc(e.id)) + '</div></div></li>';
    }).join('') + '</ul>' : '<div class="empty small">Belum ada aktivitas.</div>') + '</div>';
  }

  // ---------- cari line (jika QR tidak berfungsi) ----------
  function linePicker() {
    var draft = { factory: state.filter.factory, baterai: state.filter.baterai, q: '' };
    openSheet('<h2>Cari line</h2><input type="search" id="lp-q" class="search" placeholder="Ketik line, nama, proses…" style="margin:10px 0">' +
      '<div id="lp-f"></div><div id="lp-list" style="margin-top:12px"></div>');
    function drawFilters() {
      var bats = batteriesFor(draft.factory);
      if (draft.baterai && bats.indexOf(draft.baterai) === -1) draft.baterai = '';
      $('lp-f').innerHTML = chips('factory', [{ value: '', label: 'Semua factory' }].concat(M().factories.map(function (f) { return { value: f.id, label: f.name }; })), { selected: draft.factory }) +
        '<div style="height:8px"></div>' + chips('baterai', [{ value: '', label: 'Semua baterai' }].concat(bats), { selected: draft.baterai });
      bindChips($('lp-f'), function (n, v) { draft[n] = v; drawFilters(); drawList(); });
    }
    function drawList() {
      var list = linesFor({ factory: draft.factory, baterai: draft.baterai }, draft.q).slice(0, 150);
      $('lp-list').innerHTML = list.length ? list.map(function (l) {
        return '<button class="item" data-pick="' + esc(l.id) + '"><div class="row between"><span class="t">' + esc(l.id) + (l.name ? ' · ' + esc(L(l.name)) : '') + '</span>' +
          '</div><div class="small muted">' + esc(factoryName(l.factory) || '-') +
          (l.proses ? ' · ' + esc(L(l.proses)) : '') + (l.area ? ' · ' + esc(l.area) : '') + ' · ' + esc(l.batteries.join(', ')) + '</div></button>';
      }).join('') : '<div class="empty">Tidak ada line yang cocok.</div>';
      var bs = $('lp-list').querySelectorAll('[data-pick]');
      for (var i = 0; i < bs.length; i++) bs[i].onclick = function () { var id = this.getAttribute('data-pick'); closeSheet(); openLine(id, null); };
    }
    $('lp-q').oninput = function () { draft.q = this.value; drawList(); };
    drawFilters(); drawList();
  }

  // ---------- kartu pekerjaan aktif ----------
  function workCard(r) {
    var paused = r.status === 'Pause';
    var html = '<div class="card dark work"><div class="top"><div>' + pill(r.status) + (r.tipe ? ' <span class="pill">' + esc(r.tipe) + '</span>' : '') +
      '<h2>' + lineTitle(r) + '</h2>' +
      '<div class="small muted">' + esc(r.id) + ' · ' + t('Baterai {b}', { b: esc(r.battery) }) + '</div></div></div>';
    if (r.warnedIso) {
      html += '<div class="alert warn" style="margin:16px 0 0">' + t('<b>Sudah lebih dari {h} jam.</b> Masih dikerjakan? Jika tidak dijawab sampai {a} jam, status jadi Abandoned.',
        { h: esc(state.boot.limits.warnHours), a: esc(state.boot.limits.abandonHours) }) +
        '<div class="btn-row" style="margin-top:12px"><button class="btn ok" data-act="confirm">Masih lanjut</button>' +
        '<button class="btn navy" data-act="pending">Pending</button><button class="btn danger-ghost" data-act="cancel">Cancel</button></div></div>';
    }
    if (paused) {
      html += '<div class="timer paused js-hms"' + timerAttrs(r.pauseMin, r.sinceIso, true) + '>' + hms(0) + '</div>' +
        '<div class="sub-timers muted"><span>Waktu pause</span><span>Aktif <b class="js-dur"' + timerAttrs(r.activeMin, r.sinceIso, false) + '></b></span></div>' +
        '<button class="btn xl" data-act="resume">▶ RESUME</button>' +
        '<div class="btn-row two" style="margin-top:10px"><button class="btn ghost" data-act="pending">Pending</button>' +
        '<button class="btn ghost" data-act="cancel">Cancel</button></div>';
    } else {
      html += '<div class="timer js-hms"' + timerAttrs(r.activeMin, r.sinceIso, true) + '>' + hms(0) + '</div>' +
        '<div class="sub-timers muted"><span>Waktu aktif' + (r.tipe === 'Preventive' ? '' : ' (MTTR)') + '</span>' + (r.pauseMin ? '<span>Pause <b class="js-dur"' + timerAttrs(r.pauseMin, r.sinceIso, false) + '></b></span>' : '') + '</div>' +
        '<button class="btn xl ok" data-act="complete">✔ SELESAI</button>' +
        '<div class="btn-row" style="margin-top:10px"><button class="btn ghost" data-act="pause">Pause</button>' +
        '<button class="btn ghost" data-act="pending">Pending</button><button class="btn ghost" data-act="cancel">Cancel</button></div>';
    }
    if (r.dikerjakan) {
      html += '<details style="margin-top:14px" data-trbox><summary class="small muted">Pekerjaan sebelumnya</summary>' +
        '<div class="small" style="white-space:pre-line;margin-top:8px" data-tr>' + esc(r.dikerjakan) + '</div></details>';
    }
    return html + '</div>';
  }

  function bindWork(r, root) {
    var boxes = root.querySelectorAll('[data-trbox]');
    for (var k = 0; k < boxes.length; k++) trButton(boxes[k]);
    if (!r) return;
    var btns = root.querySelectorAll('[data-act]');
    for (var i = 0; i < btns.length; i++) {
      (function (b) {
        b.onclick = function () {
          var a = b.getAttribute('data-act');
          if (a === 'resume') act(b, 'apiResume', [r.id], 'Lanjut kerja. Timer aktif berjalan.');
          if (a === 'confirm') act(b, 'apiConfirmStillWorking', [r.id], 'Tercatat: masih dikerjakan.');
          if (a === 'pause') pauseSheet(r);
          if (a === 'pending') pendingSheet(r);
          if (a === 'complete') completeSheet(r);
          if (a === 'cancel') cancelSheet(r);
        };
      })(btns[i]);
    }
  }

  /** Semua aksi kerja mengembalikan lineView terbaru. */
  function act(btn, fn, args, okMsg) {
    busy(btn, true);
    return call.apply(null, [fn].concat(args)).then(function (v) {
      closeSheet();
      syncClock(v.serverNowIso);
      var mine = state.boot.myOpen;
      if (v.openIsMine) state.boot.myOpen = v.open;
      else if (mine && v.line && mine.line === v.line.id) state.boot.myOpen = null;
      if (state.lineView) { state.lineView = v; renderLine(); } else renderHome();
      toast(okMsg, 'ok');
      refresh();
      return v;
    }).catch(function (e) { busy(btn, false); toast(cleanErr(e), 'err'); throw e; });
  }

  // ---------- bottom sheet ----------
  function openSheet(html, onClose) {
    closeSheet();
    $('sheet-root').innerHTML = '<div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"><div class="grab"></div>' + html + '</div></div>';
    $('sheet-bg').addEventListener('click', function (ev) { if (ev.target.id === 'sheet-bg') closeSheet(); });
    state.sheetClose = onClose || function () {};
    return $('sheet');
  }
  function closeSheet() {
    if (!state.sheetClose) return;
    var fn = state.sheetClose;
    state.sheetClose = null;
    try { fn(); } catch (e) { /* abaikan */ }
    $('sheet-root').innerHTML = '';
  }
  function chips(name, values, opts) {
    opts = opts || {};
    return '<div class="chips' + (opts.big ? ' big' : '') + '" data-chips="' + esc(name) + '">' + values.map(function (v) {
      var val = typeof v === 'string' ? v : v.value, label = typeof v === 'string' ? v : v.label;
      var dis = typeof v === 'object' && v.disabled;
      return '<button type="button" class="chip' + (opts.selected === val ? ' on' : '') + (dis ? ' busy' : '') + '" data-val="' + esc(val) + '"' + (dis ? ' disabled' : '') + '>' +
        esc(label) + (typeof v === 'object' && v.sub ? '<span class="sub">' + esc(v.sub) + '</span>' : '') + '</button>';
    }).join('') + '</div>';
  }
  function bindChips(root, onChange) {
    var groups = root.querySelectorAll('[data-chips]');
    for (var i = 0; i < groups.length; i++) {
      (function (g) {
        if (g.dataset.bound) return;
        g.dataset.bound = '1';
        g.addEventListener('click', function (ev) {
          var c = ev.target.closest('.chip');
          if (!c || c.disabled) return;
          var all = g.querySelectorAll('.chip');
          for (var j = 0; j < all.length; j++) all[j].classList.toggle('on', all[j] === c);
          var wrap = g.closest('[data-field]');
          if (wrap) toggleOther(wrap, c.getAttribute('data-val'));
          if (onChange) onChange(g.getAttribute('data-chips'), c.getAttribute('data-val'));
        });
      })(groups[i]);
    }
  }
  function chipVal(root, name) {
    var c = root.querySelector('[data-chips="' + name + '"] .chip.on');

  // ---------- form engine (definisi dari sheet "Form") ----------
  function fieldHtml(d) {
    if (d.type === 'teks' && !d.required && /^Detail /.test(d.field)) {
      // Detail opsional di bawah pilihan: tertutup dulu supaya form tetap pendek.
      return '<div data-field="' + esc(d.field) + '" data-type="teks" class="detail-field"><button type="button" class="link small" data-open-detail><span class="plus">+ </span>' +
        '<span>' + esc(lbl(d)) + '</span> <span class="muted">(opsional)</span></button><input type="text" data-input class="hidden" maxlength="300" placeholder="' + esc(lbl(d)) + '…"></div>';
    }
    var label = '<label class="lbl"><span>' + esc(lbl(d)) + '</span>' + (d.required ? ' *' : ' <span class="muted">(opsional)</span>') + '</label>';
    var body;
    if (d.type === 'pilihan') {
      body = d.options.length <= 8 ? chips('f', d.options) :
        '<select data-input><option value="">Pilih…</option>' + d.options.map(function (o) { return '<option value="' + esc(o) + '">' + esc(L(o)) + '</option>'; }).join('') + '</select>';
      if (d.other) body += '<input type="text" data-other class="hidden" style="margin-top:8px" placeholder="' + esc(t('Tulis {x}…', { x: lbl(d).toLowerCase() })) + '">';
    } else if (d.type === 'angka') {
      body = '<input type="number" data-input inputmode="decimal">';
    } else {
      body = '<textarea data-input></textarea>';
    }
    return '<div data-field="' + esc(d.field) + '" data-type="' + esc(d.type) + '">' + label + body + '</div>';
  }
  function toggleOther(wrap, val) {
    var o = wrap.querySelector('[data-other]');
    if (!o) return;
    o.classList.toggle('hidden', val !== OTHER);
    if (val === OTHER) o.focus();
  }
  /** Render semua field sebuah form; field sistem memakai renderer khusus. */
  function formHtml(form, sys) {
    return M().forms[form].map(function (d) {
      if (d.type === 'sistem') return sys && sys[d.field] ? sys[d.field](d) : '';
      return fieldHtml(d);
    }).join('');
  }
  function bindForm(root) {
    bindChips(root);
    var sels = root.querySelectorAll('[data-field] select[data-input]');
    for (var i = 0; i < sels.length; i++) sels[i].onchange = function () { toggleOther(this.closest('[data-field]'), this.value); };
    var ds = root.querySelectorAll('[data-open-detail]');
    for (var j = 0; j < ds.length; j++) ds[j].onclick = function () {
      var inp = this.parentNode.querySelector('[data-input]');
      this.classList.add('opened'); this.disabled = true;   // tetap tampil sebagai label
      inp.classList.remove('hidden'); inp.focus();
    };
  }
  function setChip(root, name, val) {
    var all = root.querySelectorAll('[data-chips="' + name + '"] .chip');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('on', all[i].getAttribute('data-val') === val);
  }
  function collectForm(root) {
    var out = { values: {}, other: {} };
    var wraps = root.querySelectorAll('[data-field]');
    for (var i = 0; i < wraps.length; i++) {
      var w = wraps[i], f = w.getAttribute('data-field');
      var chip = w.querySelector('.chip.on'), inp = w.querySelector('[data-input]'), oth = w.querySelector('[data-other]');
      out.values[f] = chip ? chip.getAttribute('data-val') : (inp ? inp.value : '');
      if (oth && out.values[f] === OTHER) out.other[f] = oth.value;
    }
    return out;
  }

  function pauseSheet(r) {

        '<div data-field="' + esc(d.field) + '">' + chips('f', vals, { big: true }) +
        (d.other ? '<input type="text" data-other class="hidden" style="margin-top:10px" placeholder="Tulis alasan…">' +
          '<button class="btn hidden" id="pz-save" style="margin-top:10px">Pause</button>' : '') + '</div>');
      bindChips(s, function (n, val) {
        if (val === OTHER) { $('pz-save').classList.remove('hidden'); return; }
        var c = s.querySelector('.chip.on');
        act(c, 'apiPause', [r.id, { values: (function () { var o = {}; o[d.field] = val; return o; })() }], 'Pause. Tap RESUME saat kembali.').catch(function () {});
      });
      if ($('pz-save')) $('pz-save').onclick = function () { act(this, 'apiPause', [r.id, collectForm(s)], 'Pause. Tap RESUME saat kembali.').catch(function () {}); };

    bindForm(s2);
    $('pz-save').onclick = function () { act(this, 'apiPause', [r.id, collectForm(s2)], 'Pause. Tap RESUME saat kembali.').catch(function () {}); };

  function tenggatHtml(d) {

      '<input type="date" id="p-date" class="hidden" style="margin-top:8px"></div>';
  }

  function pendingSheet(r) {
    var s = openSheet('<h2>Pending</h2><p class="small muted">Satu form. Pekerjaan ini akan muncul di tab Pending untuk semua teknisi.</p>' +

    bindChips(s.querySelector('[data-sys="tenggat"]'), function (name, val) { $('p-date').classList.toggle('hidden', val !== 'TANGGAL'); });

  // ---------- Selesai: pilih sparepart (katalog Jenis → Nama → Model, cari, manual) ----------
  function partLabel(p) { return p.nama + (p.model ? ' ' + p.model : ''); }

  function completeSheet(r) {
    var cat = M().spareparts || [];
    var jenisCat = [];
    (M().jenisKerusakan || []).concat(cat.map(function (p) { return p.jenis; })).forEach(function (j) {
      if (j && jenisCat.indexOf(j) === -1 && cat.some(function (p) { return p.jenis === j; })) jenisCat.push(j);
    });
    var jenisManual = (M().jenisKerusakan || []).slice();
    jenisCat.forEach(function (j) { if (jenisManual.indexOf(j) === -1) jenisManual.push(j); });
    var pk = { parts: [], jenis: jenisCat[0] || '', jenisTouched: false, nama: '', q: '' };

    var s = openSheet('<h2>Selesai</h2><p class="small muted">' + esc(r.line) + (r.mesin ? ' · ' + esc(L(r.mesin)) : '') + ' · ' + t('waktu selesai dicatat server saat disimpan.') + '</p><div class="stack">' +
      formHtml('Selesai', { 'Part': function (d) {
        return '<div data-sys="part"><label class="lbl"><span>' + esc(lbl(d)) + '</span> *</label>' +
          chips('part', [{ value: 'NONE', label: NO_PART }, { value: 'SOME', label: 'Ada part' }], { big: true }) +
          '<div id="pk" class="picker hidden"><div id="pk-used"></div>' +
          (cat.length ? '<input type="search" id="pk-q" class="search" placeholder="Cari sparepart (nama / model)…" style="margin-top:12px"><div id="pk-browse"></div>'
            : '<p class="small muted">Katalog sparepart belum diisi admin. Pakai tambah manual.</p>') +
          '<button type="button" class="link" id="pk-manual-open" style="margin-top:12px">+ Tidak ada di daftar? Tambah manual</button>' +
          '<div id="pk-manual" class="manual hidden"><label class="lbl">Jenis sparepart *</label>' + chips('mjenis', jenisManual) +
          '<input type="text" id="pk-m-nama" maxlength="120" placeholder="Nama sparepart * (mis. Bearing)" style="margin-top:10px">' +
          '<input type="text" id="pk-m-model" maxlength="120" placeholder="Model / tipe (opsional)" style="margin-top:8px">' +
          '<div class="row" style="margin-top:8px"><input type="number" id="pk-m-qty" min="1" max="999" value="1" inputmode="numeric" style="width:90px">' +
          '<button type="button" class="btn navy" id="pk-m-add">Tambah ke daftar</button></div>' +
          '<p class="tiny muted" style="margin:6px 0 0">Sering dipakai? Minta admin memasukkannya ke sheet Sparepart.</p></div></div></div>';
      }, 'PIC tambahan': function (d) {
        // 2.6: teknisi lain yang ikut mengerjakan → tap nama (boleh lebih dari satu); ikut dihitung per teknisi.
        var people = (M().people || []).filter(function (p) { return p.email !== state.boot.user.email; });
        if (!people.length) return '';
        return '<div data-sys="pic"><label class="lbl"><span>' + esc(lbl(d)) + '</span> <span class="muted">(opsional)</span></label>' +
          (people.length > 8 ? '<input type="search" id="pic-q" class="search" placeholder="Cari nama…" style="margin-bottom:8px">' : '') +
          '<div class="chips" id="pic-list">' + people.map(function (p) {
            return '<button type="button" class="chip" data-pic="' + esc(p.email) + '">' + esc(p.name) + '</button>';
          }).join('') + '</div></div>';
      } }) +
      '<button class="btn ok" id="c-save">Simpan & selesai</button></div>');
    if ($('pic-list')) $('pic-list').onclick = function (ev) { var c = ev.target.closest('[data-pic]'); if (c) c.classList.toggle('on'); };
    if ($('pic-q')) $('pic-q').oninput = function () {
      var q = this.value.trim().toLowerCase(), cs = $('pic-list').querySelectorAll('[data-pic]');
      for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('hidden', !!q && cs[i].textContent.toLowerCase().indexOf(q) === -1 && !cs[i].classList.contains('on'));
    };

    function addPart(item) {
      var ex = pk.parts.filter(function (p) { return !p.manual && p.id === item.id; })[0];
      if (ex) ex.qty = Math.min(999, ex.qty + 1);
      else pk.parts.push({ id: item.id, jenis: item.jenis, nama: item.nama, model: item.model, satuan: item.satuan, qty: 1 });
      toast(t('Ditambahkan: {p}', { p: partLabel(item) + (ex ? ' (×' + ex.qty + ')' : '') }), 'ok');
      drawUsed(); drawBrowse();
    }
    function drawUsed() {
      $('pk-used').innerHTML = pk.parts.length ? '<div class="caps" style="margin-top:12px">' + t('Part dipakai ({n})', { n: pk.parts.length }) + '</div>' + pk.parts.map(function (p, i) {
        return '<div class="used"><div class="grow"><b>' + esc(p.nama) + '</b>' + (p.model ? ' <span class="small">' + esc(p.model) + '</span>' : '') +
          '<div class="tiny muted">' + esc([L(p.jenis), p.manual ? t('manual') : '', p.satuan].filter(String).join(' · ')) + '</div></div>' +
          '<div class="qty"><button type="button" data-dec="' + i + '" aria-label="Kurangi">−</button><input type="number" min="1" max="999" inputmode="numeric" data-qty="' + i + '" value="' + p.qty + '">' +
          '<button type="button" data-inc="' + i + '" aria-label="Tambah">+</button></div><button type="button" class="rm" data-rm="' + i + '" aria-label="Hapus">×</button></div>';
      }).join('') : '<p class="small muted" style="margin:12px 0 0">Belum ada part. Cari, atau pilih jenis → nama → model di bawah.</p>';
      var root = $('pk-used');
      var each = function (sel, fn) { var els = root.querySelectorAll(sel); for (var k = 0; k < els.length; k++) fn(els[k]); };
      each('[data-dec]', function (b) { b.onclick = function () { var p = pk.parts[+b.getAttribute('data-dec')]; p.qty = Math.max(1, p.qty - 1); drawUsed(); }; });
      each('[data-inc]', function (b) { b.onclick = function () { var p = pk.parts[+b.getAttribute('data-inc')]; p.qty = Math.min(999, p.qty + 1); drawUsed(); }; });
      each('[data-qty]', function (inp) { inp.onchange = function () { var v = Math.floor(Number(inp.value)); pk.parts[+inp.getAttribute('data-qty')].qty = v >= 1 && v <= 999 ? v : 1; drawUsed(); }; });
      each('[data-rm]', function (b) { b.onclick = function () { pk.parts.splice(+b.getAttribute('data-rm'), 1); drawUsed(); drawBrowse(); }; });
    }
    function usedQty(id) { var p = pk.parts.filter(function (x) { return !x.manual && x.id === id; })[0]; return p ? p.qty : 0; }
    function itemBtn(p, showJenis) {
      var q = usedQty(p.id);
      return '<button type="button" class="pitem' + (q ? ' on' : '') + '" data-add="' + esc(p.id) + '"><span class="grow"><b>' + esc(showJenis ? p.nama : (p.model || p.nama)) + '</b>' +
        (showJenis && p.model ? ' ' + esc(p.model) : '') + '<span class="tiny muted"> ' + esc([showJenis ? L(p.jenis) : '', p.satuan].filter(String).join(' · ')) + '</span></span>' +
        '<span class="add">' + (q ? '✓ ×' + q : '+') + '</span></button>';
    }
    function drawBrowse() {
      var box = $('pk-browse');
      if (!box) return;
      // Posisi scroll kolom dipertahankan saat digambar ulang (tap nama / tambah part tidak melompat ke atas).
      var keep = {};
      ['pk-names', 'pk-models', 'pk-hits'].forEach(function (id) { if ($(id)) keep[id] = $(id).scrollTop; });
      var html = '';
      if (pk.q) {
        var words = pk.q.toLowerCase().split(/\s+/).filter(String);
        var hits = cat.filter(function (p) {
          var hay = (p.nama + ' ' + p.model + ' ' + p.jenis).toLowerCase();
          return words.every(function (w) { return hay.indexOf(w) !== -1; });
        }).slice(0, 50);
        html = hits.length ? '<div class="plist scroll-y" id="pk-hits">' + hits.map(function (p) { return itemBtn(p, true); }).join('') + '</div>'
          : '<p class="small muted" style="margin:10px 0 0">' + t('Tidak ditemukan di katalog. Pakai <b>Tambah manual</b> di bawah.') + '</p>';
      } else {
        var names = [];
        cat.forEach(function (p) { if (p.jenis === pk.jenis && names.indexOf(p.nama) === -1) names.push(p.nama); });
        var models = cat.filter(function (p) { return p.jenis === pk.jenis && p.nama === pk.nama; });
        // Jenis = satu baris geser; Nama & Model = dua kolom tinggi tetap, masing-masing scroll sendiri.
        html = '<div class="scroll-x" style="margin-top:12px">' + chips('pjenis', jenisCat, { selected: pk.jenis }) + '</div>' +
          '<div class="cascade"><div class="cascade-head"><span>' + t('Nama sparepart ({n})', { n: names.length }) + '</span><span>' + t('Model') + (pk.nama ? ' · ' + esc(pk.nama) : '') + '</span></div>' +
          '<div class="cascade-body"><div class="ccol" id="pk-names">' + names.map(function (n) {
            var c = cat.filter(function (p) { return p.jenis === pk.jenis && p.nama === n; });
            var q = c.reduce(function (sum, p) { return sum + usedQty(p.id); }, 0);
            return '<button type="button" class="nitem' + (n === pk.nama ? ' on' : '') + '" data-nama="' + esc(n) + '"><span class="grow">' + esc(n) + '</span>' +
              (q ? '<span class="tiny used-n">✓' + q + '</span>' : (c.length > 1 ? '<span class="tiny muted">' + t('{n} model', { n: c.length }) + '</span>' : '')) + '</button>';
          }).join('') + '</div>' +
          '<div class="ccol models" id="pk-models">' + (pk.nama ? models.map(function (p) { return itemBtn(p, false); }).join('')
            : '<p class="tiny muted" style="margin:0;padding:12px">← Pilih nama sparepart</p>') + '</div></div></div>';
      }
      box.innerHTML = html;
      Object.keys(keep).forEach(function (id) { if ($(id)) $(id).scrollTop = keep[id]; });
      bindChips(box, function (n, val) {
        if (n === 'pjenis') { pk.jenis = val; pk.jenisTouched = true; pk.nama = ''; drawBrowse(); if ($('pk-names')) $('pk-names').scrollTop = 0; }
      });
      var ns = box.querySelectorAll('[data-nama]');
      for (var j = 0; j < ns.length; j++) ns[j].onclick = function () {
        pk.nama = this.getAttribute('data-nama');
        drawBrowse();
        if ($('pk-models')) $('pk-models').scrollTop = 0;
      };
      var adds = box.querySelectorAll('[data-add]');
      for (var k = 0; k < adds.length; k++) adds[k].onclick = function () {
        var id = this.getAttribute('data-add');
        addPart(cat.filter(function (p) { return p.id === id; })[0]);
      };
    }

    bindChips(s.querySelector('[data-sys="part"]'), function (name, val) {
      if (name === 'part') { $('pk').classList.toggle('hidden', val !== 'SOME'); if (val === 'SOME') { drawUsed(); drawBrowse(); } }
    });
    bindForm(s);
    // Jenis kerusakan dipilih → filter Jenis sparepart ikut (kecuali teknisi sudah memilih jenis sendiri).
    var jk = s.querySelector('[data-field="Jenis kerusakan"]');
    function syncJenis() {
      if (!jk || pk.jenisTouched) return;
      var c = jk.querySelector('.chip.on'), sel = jk.querySelector('select');
      var v = c ? c.getAttribute('data-val') : (sel ? sel.value : '');
      if (v && jenisCat.indexOf(v) !== -1 && v !== pk.jenis) { pk.jenis = v; pk.nama = ''; drawBrowse(); }
    }
    if (jk) { jk.addEventListener('click', syncJenis); jk.addEventListener('change', syncJenis); }
    if ($('pk-q')) $('pk-q').oninput = function () { pk.q = this.value.trim(); drawBrowse(); };
    $('pk-manual-open').onclick = function () {
      this.classList.add('hidden');
      $('pk-manual').classList.remove('hidden');
      if (pk.q && !$('pk-m-nama').value) $('pk-m-nama').value = pk.q;
      var jcur = jk && jk.querySelector('.chip.on');
      if (jcur && jenisManual.indexOf(jcur.getAttribute('data-val')) !== -1) setChip($('pk-manual'), 'mjenis', jcur.getAttribute('data-val'));
      $('pk-m-nama').focus();
    };
    $('pk-m-add').onclick = function () {
      var jenis = chipVal($('pk-manual'), 'mjenis'), nama = $('pk-m-nama').value.trim(), model = $('pk-m-model').value.trim();
      var qty = Math.floor(Number($('pk-m-qty').value));
      if (!jenis) { toast('Pilih jenis sparepart.', 'err'); return; }
      if (!nama) { toast('Isi nama sparepart.', 'err'); $('pk-m-nama').focus(); return; }
      if (!(qty >= 1 && qty <= 999)) { toast('Jumlah harus 1–999.', 'err'); return; }
      pk.parts.push({ manual: true, jenis: jenis, nama: nama, model: model, qty: qty });
      $('pk-m-nama').value = ''; $('pk-m-model').value = ''; $('pk-m-qty').value = 1;
      toast(t('Ditambahkan (manual): {p}', { p: nama }), 'ok');
      drawUsed();
    };
    $('c-save').onclick = function () {
      var mode = chipVal(s, 'part');
      if (!mode) { toast(t('Sparepart: pilih "{a}" atau "{b}".', { a: t(NO_PART), b: t('Ada part') }), 'err'); return; }
      if (mode === 'SOME' && !pk.parts.length) { toast(t('Tambahkan minimal satu part, atau pilih "{a}".', { a: t(NO_PART) }), 'err'); return; }
      var input = collectForm(s);
      input.tanpaPart = mode === 'NONE';
      input.pics = [].map.call(s.querySelectorAll('#pic-list [data-pic].on'), function (c) { return c.getAttribute('data-pic'); });
      input.parts = mode === 'NONE' ? [] : pk.parts.map(function (p) {
        return p.manual ? { manual: true, jenis: p.jenis, nama: p.nama, model: p.model, qty: p.qty } : { id: p.id, qty: p.qty };
      });
      act(this, 'apiComplete', [r.id, input], 'Maintenance selesai. Terima kasih!').catch(function () {});
    };
  }

  function cancelSheet(r) {
    var s = openSheet('<h2>Cancel maintenance</h2><p class="small muted">Record masuk review Admin dan tidak dihitung ke MTTR.</p><div class="stack">' +
      formHtml('Cancel') + '<button class="btn danger-ghost" id="x-save">Konfirmasi cancel</button></div>');

  function startCardHtml(v) {
    var l = v.line, defs = M().forms.Mulai, html = '';
    var tipeDef = defs.filter(function (d) { return d.field === 'Tipe'; })[0];
    defs.forEach(function (d) {

  // ---------- Lanjutkan pending: konfirmasi QR ----------
  function continuePending(p, btn) {
    function go(lineId, b) {
      busy(b, true, t('Melanjutkan…'));
      return call('apiContinue', p.id, lineId).then(function (v) {
        closeSheet();
        syncClock(v.serverNowIso);
        state.qr = { line: String(lineId).toUpperCase(), at: Date.now() };
        state.boot.myOpen = v.open;
        state.lineView = v;

    }
    if (freshQr(p.line)) return go(state.qr.line, btn);   // masuk lewat scan QR: konfirmasi dilewati
    openScanner({ expectLine: p.line, onResult: function (line) { go(line, null); } });
  }

  /** Isi QR: URL web app ?line=..&mesin=.., atau teks Line ID saja. */
  function parseQr(text) {
    text = String(text || '').trim();
    var ok = function (v) { return /^[A-Za-z0-9_.-]{1,50}$/.test(v || '') ? v.toUpperCase() : ''; };
    var ml = /[?&]line=([^&#]+)/.exec(text), mm = /[?&]mesin=([^&#]+)/.exec(text);
    if (ml || mm) return { line: ml ? ok(decodeURIComponent(ml[1])) : '', mesin: mm ? ok(decodeURIComponent(mm[1])) : '' };
    return { line: ok(text), mesin: '' };
  }

  /** Tombol "Scan QR" di Beranda: QR line atau QR mesin, tanpa keluar dari web app. */
  function scanAny() {
    openScanner({ onResult: function (line, mesin) {
      closeSheet();
      state.qr = { line: line, at: Date.now() };
      openLine(line, null, mesin);
    } });
  }

  /**
   * @param {{expectLine?:string, onResult:function(string, string)}} o
   *   expectLine: QR harus line ini (konfirmasi lanjut pending).
   */
  function openScanner(o) {
    var stream = null, stopped = false, timer = null;
    var title = o.expectLine ? t('Scan QR line {l}', { l: o.expectLine }) : t('Scan QR line / mesin');
    var s = openSheet('<h2>' + esc(title) + '</h2>' +
      '<p class="small muted">' + (o.expectLine ? esc(t('Konfirmasi Anda benar-benar di mesin.')) + ' ' : '') + esc(t('Arahkan kamera ke QR yang ditempel di line/mesin.')) + '</p>' +
      '<div class="scan-box" id="scan-box"><video id="scan-video" playsinline muted></video><div class="frame"></div></div>' +
      '<p class="small center" id="scan-status" style="margin-top:12px">Membuka kamera…</p>' +
      (o.expectLine ? '' : '<button class="btn ghost" id="scan-manual">Cari line manual</button>'), function () {
        stopped = true;
        clearTimeout(timer);
        if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      });
    if ($('scan-manual')) $('scan-manual').onclick = function () { closeSheet(); linePicker(); };

    function fallback(reason) {
      if (stopped) return;
      $('scan-box').classList.add('hidden');
      $('scan-status').innerHTML = '<div class="alert warn" style="text-align:left">' + t('<b>Kamera tidak bisa dibuka di dalam aplikasi</b> ({r}).', { r: esc(t(reason)) }) + '<br>' +
        (o.expectLine
          ? t('Tutup layar ini, lalu scan QR line <b>{l}</b> dengan aplikasi kamera HP. Halaman line akan terbuka dengan tombol <b>Lanjutkan</b> tanpa scan ulang.', { l: esc(o.expectLine) })
          : t('Scan QR dengan aplikasi kamera HP (halaman line terbuka otomatis), atau pakai <b>Cari line manual</b>.')) + '</div>';
    }
    function found(text) {
      var q = parseQr(text);
      if (!q.line && !q.mesin) { $('scan-status').textContent = 'QR tidak dikenali, coba lagi…'; return false; }
      if (o.expectLine && q.line !== String(o.expectLine).toUpperCase()) { $('scan-status').textContent = t('Ini QR {q}, bukan line {l}.', { q: q.line || q.mesin, l: o.expectLine }); return false; }
      if (!q.line) { $('scan-status').textContent = 'QR mesin lama tanpa line. Cetak ulang QR dari Dashboard → QR.'; return false; }
      $('scan-status').textContent = t('QR {q} terbaca ✓', { q: q.line + (q.mesin ? ' · ' + q.mesin : '') });
      stopped = true;
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      o.onResult(q.line, q.mesin);
      return true;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fallback('browser tidak mendukung');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then(function (st) {
      if (stopped) { st.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = st;
      var video = $('scan-video');
      video.srcObject = st;
      video.play();
      $('scan-status').textContent = 'Mencari QR…';
      getDecoder().then(function (decode) {
        var canvas = document.createElement('canvas'), c2d = canvas.getContext('2d');
        (function loop() {
          if (stopped) return;
          if (video.readyState >= 2) {
            decode(video, canvas, c2d).then(function (text) {
              if (!(text && found(text))) timer = setTimeout(loop, 250);
            }).catch(function () { timer = setTimeout(loop, 400); });
          } else timer = setTimeout(loop, 250);
        })();
      }).catch(function () { fallback('decoder QR gagal dimuat'); });
    }).catch(function (e) { fallback((e && e.name) || 'izin ditolak'); });
  }

  /** BarcodeDetector (Chrome Android) jika ada, selain itu jsQR dari CDN. */
  var decoderPromise = null;
  function getDecoder() {
    if (decoderPromise) return decoderPromise;
    if ('BarcodeDetector' in window) {
      var det = new window.BarcodeDetector({ formats: ['qr_code'] });
      decoderPromise = Promise.resolve(function (video) {
        return det.detect(video).then(function (codes) { return codes.length ? codes[0].rawValue : ''; });
      });
    } else {
      decoderPromise = new Promise(function (resolve, reject) {
        var sc = document.createElement('script');
        sc.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
        sc.onload = function () {
          resolve(function (video, canvas, c2d) {
            var w = video.videoWidth, h = video.videoHeight, scale = Math.min(1, 640 / Math.max(w, h));
            canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
            c2d.drawImage(video, 0, 0, canvas.width, canvas.height);
            var img = c2d.getImageData(0, 0, canvas.width, canvas.height);
            var code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
            return Promise.resolve(code ? code.data : '');
          });
        };
        sc.onerror = function () { decoderPromise = null; reject(new Error('load')); };
        document.head.appendChild(sc);
      });
    }
    return decoderPromise;
  }

  // ---------- Download Riwayat (.xlsx; CSV jika library Excel tidak bisa dimuat) ----------
  var EXCELJS_SRC = ['https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'];
  var EXCELJS_SRI = 'sha384-Pqp51FUN2/qzfxZxBCtF0stpc9ONI6MYZpVqmo8m20SoaQCzf+arZvACkLkirlPz';
  var excelLoad = null;
  /** ExcelJS dimuat hanya saat Download (±1 MB), dicoba dari dua CDN; integritas file dicek (SRI). */
  function loadExcelJs() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if (excelLoad) return excelLoad;
    excelLoad = EXCELJS_SRC.reduce(function (p, src) {
      return p.catch(function () {
        return new Promise(function (ok, fail) {
          var el = document.createElement('script');
          el.src = src; el.integrity = EXCELJS_SRI; el.crossOrigin = 'anonymous'; el.async = true;
          var timer = setTimeout(function () { el.remove(); fail(new Error('timeout')); }, 20000);
          el.onload = function () { clearTimeout(timer); window.ExcelJS ? ok(window.ExcelJS) : fail(new Error('ExcelJS kosong')); };
          el.onerror = function () { clearTimeout(timer); el.remove(); fail(new Error('gagal memuat ' + src)); };
          document.head.appendChild(el);
        });
      });
    }, Promise.reject(new Error('mulai')));
    excelLoad.catch(function () { excelLoad = null; });   // dicoba lagi lain kali (mis. sinyal kembali)
    return excelLoad;
  }

  function openDownload() {
    var h = state.history;
    var s = openSheet('<h2>' + esc(t('Download riwayat')) + '</h2><p class="small muted">' +
      esc(t('Kolom sama dengan tab Laporan (format Excel). Filter, status & pilihan "{s}" di Riwayat ikut. Cancelled hanya jika status Cancelled dipilih.',
        { s: h.scope === 'all' ? t('Semua teknisi') : t('Pekerjaan saya') })) + '</p>' +
      '<label class="lbl">' + esc(t('Pekerjaan yang dimulai')) + '</label><div id="dl-period"></div>' +
      '<div class="stack" style="margin-top:14px"><button class="btn" id="dl-xlsx">' + esc(t('Download Excel (.xlsx)')) + '</button>' +
      '<button class="btn ghost" id="dl-csv">' + esc(t('Download CSV')) + '</button><div id="dl-out"></div></div>');
    bindPeriod(s.querySelector('#dl-period'), 'dl', state.dl, function () {});
    var go = function (kind, btn) {
      var f = serverFilter('history'), rg = periodRange(state.dl);
      f.scope = h.scope; f.status = h.status; f.tipe = h.tipe; f.from = rg.from; f.to = rg.to;
      busy(btn, true, t('Menyiapkan file…'));
      s.querySelector('#dl-out').innerHTML = '';
      call('apiExport', f).then(function (res) {
        if (!res.rows.length) { busy(btn, false); s.querySelector('#dl-out').innerHTML = '<div class="alert warn">' + esc(t('Tidak ada pekerjaan di periode ini.')) + '</div>'; return; }
        var name = 'mttr-riwayat-' + res.from + (res.to !== res.from ? '_' + res.to : '');
        var note = res.truncated ? t('Hanya {n} baris pertama dari {t} (batas per file). Persempit periode untuk sisanya.', { n: res.rows.length, t: res.total }) : '';
        var done = function (msg) { busy(btn, false); s.querySelector('#dl-out').innerHTML = '<div class="alert ' + (note ? 'warn' : 'ok') + '">' + esc(msg + (note ? ' ' + note : '')) + '</div>'; };
        if (kind === 'csv') { saveBlob(csvOf(res), name + '.csv'); done(t('✓ {n} baris diunduh (CSV).', { n: res.rows.length })); return; }
        loadExcelJs().then(function (X) { return xlsxOf(X, res); }).then(function (blob) {
          saveBlob(blob, name + '.xlsx');
          done(t('✓ {n} baris diunduh (Excel).', { n: res.rows.length }));
        }).catch(function (e) {
          console.warn('ExcelJS: ' + e);
          saveBlob(csvOf(res), name + '.csv');
          done(t('Library Excel tidak bisa dimuat (internet / jaringan kantor?). File CSV yang diunduh; bisa dibuka di Excel.'));
        });
      }).catch(function (e) { busy(btn, false); toast(cleanErr(e), 'err'); });
    };
    s.querySelector('#dl-xlsx').onclick = function () { go('xlsx', this); };
    s.querySelector('#dl-csv').onclick = function () { go('csv', this); };
  }

  function saveBlob(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
  }
  /** {d: ISO} → tanggal WIB (Excel tidak punya zona waktu: jam dinding WIB ditulis apa adanya). */
  function wib(v) { return new Date(new Date(v.d).getTime() + 7 * 3600000); }
  function csvOf(res) {
    var cell = function (v, src) {
      if (v && typeof v === 'object' && v.d) { var d = wib(v); v = two(d.getUTCDate()) + '/' + two(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear() + (src === 'Tanggal' ? '' : ' ' + two(d.getUTCHours()) + ':' + two(d.getUTCMinutes())); }
      v = v == null ? '' : String(v);
      if (/^[=+\-@]/.test(v)) v = "'" + v;   // cegah formula injection saat dibuka di Excel
      return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    };
    var out = [res.columns.map(function (c) { return cell(c.name); }).join(',')].concat(res.rows.map(function (r) {
      return r.map(function (v, i) { return cell(v, res.columns[i].source); }).join(',');
    }));
    return new Blob(['\ufeff' + out.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  }
  function xlsxOf(X, res) {
    var wb = new X.Workbook(), ws = wb.addWorksheet('Riwayat'), n = res.columns.length;
    wb.creator = res.appName;
    ws.addRow([res.title || res.appName]);
    ws.mergeCells(1, 1, 1, Math.max(1, n));
    ws.getRow(1).font = { bold: true, size: 13 };
    var head = ws.addRow(res.columns.map(function (c) { return c.name; }));
    head.font = { bold: true, color: { argb: 'FFFFFFFF' } };
    head.alignment = { wrapText: true, vertical: 'middle' };
    head.eachCell(function (c) { c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2F4B6E' } }; });
    var width = res.columns.map(function (c) { return Math.min(40, Math.max(8, String(c.name).length + 2)); });
    res.rows.forEach(function (r) {
      var row = ws.addRow(r.map(function (v) { return v && typeof v === 'object' && v.d ? wib(v) : v; }));
      r.forEach(function (v, i) {
        var c = row.getCell(i + 1);
        if (v && typeof v === 'object' && v.d) c.numFmt = res.columns[i].source === 'Tanggal' ? 'dd/mm/yyyy' : 'dd/mm/yyyy hh:mm';
        var lines = String(v && v.d ? '00/00/0000 00:00' : v).split('\n');   // sparepart ke bawah: satu baris per part
        width[i] = Math.min(50, Math.max(width[i], Math.max.apply(null, lines.map(function (x) { return x.length + 2; }))));
      });
      row.alignment = { wrapText: true, vertical: 'top' };
    });
    ws.columns.forEach(function (col, i) { col.width = width[i]; });
    ws.views = [{ state: 'frozen', ySplit: 2 }];
    ws.autoFilter = { from: { row: 2, column: 1 }, to: { row: 2, column: n } };
    return wb.xlsx.writeBuffer().then(function (buf) {
      return new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    });
  }

    if (note && !time) html += '<p class="tiny muted" style="margin:4px 0 0">' + (res.pareto ? '<span class="swatch vital"></span> ' : '') + esc(note) + '</p>';
    var vals = res.groups.map(function (g) { return g.value || 0; }), max = Math.max.apply(null, vals.concat([0])) || 1;
    if (!res.groups.length || (time && !k.n)) {
